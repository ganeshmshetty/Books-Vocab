[project]
name = "kg"
version = "2.2.0"
description = "Knowledge Graph for Vocabulary Recall"
# Pinned to 3.13: the project venv (backend/.venv, uv-managed) is cpython-3.13,
# and `backend/.python-version` locks the interpreter `uv` picks when it has to
# (re)create the venv. A loose `>=3.12` would let uv resolve to a Homebrew
# system Python (3.12 / 3.14) that lacks `kg` / `sentry-sdk`.
requires-python = ">=3.13,<3.14"
dependencies = [
    "openai>=1.0,<3.0",
    "numpy>=1.26,<3.0",
    "httpx>=0.25,<1.0",
    "python-dotenv>=1.0,<2.0",
    "pydantic>=2.0,<3.0",
    "wordfreq>=3.0,<4.0",
    "fastapi>=0.115,<1.0",
    "starlette>=1.0,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlmodel>=0.0.16,<1.0",
    "pyjwt>=2.11.0,<3.0",
    "cryptography>=48.0.0,<49.0",
    "google-auth[requests]>=2.25.0,<3.0",
    "filelock>=3.0,<4.0",
    "lemminflect>=0.2,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.7,<1.0",
    "psutil>=5.9,<8.0",
    "sentry-sdk[fastapi]>=2.0,<3.0",
    # Track B: read podcast media from S3-compatible object storage.
    "boto3>=1.34,<2.0",
]

[project.scripts]
kg-server = "uvicorn:main"

# Dev / test dependencies. PEP 735 dependency group — installed by
# `uv sync` (uv installs the default `dev` group automatically) but excluded
# from the runtime wheel.
#
# Version-locking: `uv.lock` is tracked in git and locks the full resolved
# dependency tree (including transitive deps). Use `uv sync --locked` to
# guarantee the locked versions, or `uv lock` after changing `pyproject.toml`.
#
# Shebang-drift guard: `.venv/bin/pytest` hard-codes an absolute interpreter
# path. If the venv was copied/moved between worktrees, that path goes dead and
# the kernel falls back to PATH → Homebrew Python (e.g. 3.14), causing silent
# interpreter mismatches. Run `ops/venv_health.py` to detect this; repair with
# `cd backend && uv sync --reinstall`.
#
# Repo policy: backend test entrypoints use module form (`python -m pytest`)
# rather than the fragile console-script form.
#
# Correct way to run the suite (always uses backend/.venv cpython-3.13):
#   cd backend && uv run python -m pytest -q
# Equivalent explicit form:
#   backend/.venv/bin/python -m pytest -q
[dependency-groups]
# The only packages the production image installs beyond runtime dependencies:
# /admin/tests runs pytest inside the container (src/kg/admin_test_matrix/runner.py).
# Dockerfile exports exactly this group (--no-default-groups --group image-test) and
# CI's image-lock job allows only it, so a tool added to `dev` never reaches the image.
image-test = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.26,<2.0",
]
dev = [
    {include-group = "image-test"},
    "pytest-cov>=6.0,<8.0",
    "ruff==0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg"]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E402",  # module import not at top of file (FastAPI router pattern)
    "B008",  # function call in default argument (FastAPI Depends pattern)
]
