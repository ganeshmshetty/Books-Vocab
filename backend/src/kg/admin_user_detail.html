<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>用戶詳情 — Books &amp; Vocab Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-force@3/dist/d3-force.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-quadtree@3/dist/d3-quadtree.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-dispatch@3/dist/d3-dispatch.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-timer@3/dist/d3-timer.min.js"></script>
<style>
:root {
  --bg: #f8f7f4;
  --surface: #fcfbfa;
  --border: #dbd6cd;
  --border-l: #e8e4db;
  --ink: #2a2520;
  --sub: #7a756c;
  --ink-light: #5a5550;
  --dev: #c0392b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.86;
  min-height: 100vh;
}
/* Top nav */
.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  height: 52px;
  padding: 0 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
}
.nav-left { display: flex; align-items: center; gap: 12px; }
.back-link {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink-light);
  text-decoration: none;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.back-link:hover { color: var(--ink); }
.brand {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  letter-spacing: .12em;
  text-transform: uppercase;
  white-space: nowrap;
}
.dev-dot {
  margin-left: 8px;
  color: var(--dev);
  border: 1px solid var(--dev);
  padding: 1px 5px;
  border-radius: 2px;
  font-size: 10px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 36px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: transparent;
  color: var(--ink-light);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: .10em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: var(--ink); color: var(--ink); }
.btn-mini { height: 28px; padding: 0 10px; font-size: 10px; }
.btn-danger { border-color: var(--dev); color: var(--dev); }
.btn-danger:hover { background: var(--dev); color: #fff; }
/* Main layout */
.main {
  max-width: 1320px;
  padding: 16px;
  margin: 0 auto 42px;
}
/* Loading */
#loading {
  text-align: center;
  padding: 60px 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--sub);
  letter-spacing: .08em;
}
/* User header */
.user-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.user-header-id {
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
  letter-spacing: .04em;
  word-break: break-all;
}
.user-header-email {
  font-size: 13px;
  color: var(--sub);
}
.badge {
  display: inline-block;
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 1px 7px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-light);
}
.user-header-actions {
  margin-left: auto;
  display: flex;
  gap: 6px;
}
/* Two-column layout */
.two-col { display: flex; gap: 24px; }
.col-left { width: 340px; flex-shrink: 0; position: sticky; top: 68px; align-self: flex-start; }
.col-left .detail-section + .detail-section { margin-top: 12px; }
.col-right { flex: 1; min-width: 0; }
.detail-section {
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--surface);
  padding: 12px 14px;
}
.detail-section-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--sub);
  text-transform: uppercase;
  letter-spacing: .12em;
  margin-bottom: 8px;
}
.detail-kv {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
  font-size: 12px;
  border-bottom: 1px solid var(--border-l);
}
.detail-kv:last-child { border-bottom: none; }
.detail-k {
  color: var(--sub);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
}
.detail-v {
  color: var(--ink);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  text-align: right;
  word-break: break-all;
  max-width: 60%;
}
.bar { height: 5px; border: 1px solid var(--border); background: var(--surface); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; transition: width .3s ease; }
.quota-fill-low { background: var(--ink-light); }
.quota-fill-mid { background: #f0a030; }
.quota-fill-high { background: #c0392b; }
/* Section blocks */
.section-block {
  margin-bottom: 32px;
}
.section-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--sub);
  text-transform: uppercase;
  letter-spacing: .14em;
  margin-bottom: 12px;
}
.chart-wrap {
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--surface);
  padding: 16px;
}
/* Playback */
.playback-wrap {
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--surface);
  padding: 16px;
}
.playback-canvas-container {
  position: relative;
  width: 100%;
  height: 600px;
  background: var(--bg);
  border: 1px solid var(--border-l);
  border-radius: 2px;
  margin-bottom: 12px;
  overflow: hidden;
}
.playback-canvas-container canvas {
  display: block;
  width: 100%;
  height: 100%;
}
.playback-controls {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.playback-controls button {
  height: 32px;
  width: 40px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--surface);
  font-size: 14px;
  cursor: pointer;
  color: var(--ink);
}
.playback-controls button:hover { border-color: var(--ink); }
.playback-controls select {
  height: 32px;
  padding: 0 8px;
  border: 1px solid var(--border);
  border-radius: 3px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  background: var(--surface);
  color: var(--ink);
}
.playback-slider {
  flex: 1;
  min-width: 120px;
}
.playback-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--sub);
  white-space: nowrap;
}
/* Tooltip */
.graph-tooltip {
  display: none;
  position: absolute;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 8px 10px;
  pointer-events: none;
  z-index: 20;
  max-width: 260px;
}
.graph-tooltip .tt-word {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink);
}
.graph-tooltip .tt-meaning {
  font-size: 12px;
  color: var(--ink-light);
  margin-top: 2px;
}
.graph-tooltip .tt-time {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--sub);
  margin-top: 4px;
}
/* No data */
.no-data {
  color: var(--sub);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: .05em;
  padding: 20px;
  text-align: center;
}
/* Grant modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(42,37,32,.45);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 24px;
  width: 400px;
  max-width: 90vw;
}
.modal-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-bottom: 16px;
}
.modal-field { margin-bottom: 12px; }
.modal-label {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--sub);
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: 4px;
}
.modal-input {
  width: 100%;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 2px;
  font-size: 13px;
  font-family: 'Noto Sans TC', sans-serif;
  color: var(--ink);
  outline: none;
  background: var(--bg);
}
.modal-input:focus { border-color: var(--ink); }
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 16px;
}
/* Pipeline history — compact scrollable list */
#pipeline-runs, #translate-entries {
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--surface);
  max-height: 320px;
  overflow-y: auto;
}
#pipeline-runs::-webkit-scrollbar,
#translate-entries::-webkit-scrollbar { width: 8px; }
#pipeline-runs::-webkit-scrollbar-thumb,
#translate-entries::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.pipeline-run {
  border: none;
  border-bottom: 1px solid var(--border-l);
  border-radius: 0;
  background: transparent;
  margin-bottom: 0;
}
.pipeline-run:last-child { border-bottom: none; }
.pipeline-run-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 12px;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
}
.pipeline-run-header:hover { background: #f6f4ef; }
.pipeline-run.open .pipeline-run-header { border-bottom: 1px solid var(--border-l); background: #f6f4ef; }
.pipeline-run-trigger {
  padding: 1px 6px;
  border: 1px solid var(--border);
  border-radius: 2px;
  font-size: 10px;
  letter-spacing: .06em;
  text-transform: uppercase;
}
.pipeline-run-time { color: var(--sub); }
.pipeline-run-status { font-weight: 500; }
.pipeline-run-status.s-completed { color: var(--ink); }
.pipeline-run-status.s-failed { color: var(--dev); }
.pipeline-run-status.s-running { color: var(--ink-light); }
.pipeline-run-duration { color: var(--sub); margin-left: auto; }
.pipeline-run-steps {
  display: none;
  padding: 8px 14px;
}
.pipeline-run.open .pipeline-run-steps { display: block; }
.pipeline-step {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  border-bottom: 1px solid var(--border-l);
}
.pipeline-step:last-child { border-bottom: none; }
.pipeline-step-name { min-width: 120px; color: var(--ink); }
.pipeline-step-status { min-width: 50px; }
.pipeline-step-status.s-ok { color: var(--ink); }
.pipeline-step-status.s-failed { color: var(--dev); }
.pipeline-step-status.s-skipped { color: var(--sub); }
.pipeline-step-status.s-running { color: var(--ink-light); }
.pipeline-step-duration { color: var(--sub); min-width: 60px; }
.pipeline-step-items { color: var(--sub); }
.pipeline-step-error { color: var(--dev); font-size: 10px; margin-top: 2px; word-break: break-all; }
/* Waterfall */
.waterfall { position: relative; margin: 8px 0; }
.waterfall-axis { display: flex; justify-content: space-between; font-size: 9px; color: var(--sub); font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid var(--border-l); padding-bottom: 4px; margin-bottom: 4px; }
.waterfall-row { display: flex; align-items: center; gap: 8px; height: 24px; }
.waterfall-label { width: 100px; font-size: 10px; font-family: 'JetBrains Mono', monospace; flex-shrink: 0; color: var(--ink); }
.waterfall-track { flex: 1; position: relative; height: 16px; background: var(--border-l); border-radius: 2px; }
.waterfall-bar { position: absolute; height: 100%; border-radius: 2px; min-width: 2px; }
.waterfall-bar.s-ok { background: var(--ink); }
.waterfall-bar.s-failed { background: var(--dev); }
.waterfall-bar.s-skipped { background: var(--sub); }
.waterfall-meta { font-size: 10px; font-family: 'JetBrains Mono', monospace; color: var(--sub); white-space: nowrap; width: 100px; flex-shrink: 0; text-align: right; }
/* Translate history — compact scrollable list */
.translate-entry {
  border: none;
  border-bottom: 1px solid var(--border-l);
  border-radius: 0;
  background: transparent;
  margin-bottom: 0;
}
.translate-entry:last-child { border-bottom: none; }
.translate-entry-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 12px;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
}
.translate-entry-header:hover { background: #f6f4ef; }
.translate-entry.open .translate-entry-header { border-bottom: 1px solid var(--border-l); background: #f6f4ef; }
.translate-entry-op {
  padding: 1px 6px;
  border: 1px solid var(--border);
  border-radius: 2px;
  font-size: 10px;
  letter-spacing: .06em;
  text-transform: uppercase;
}
.translate-entry-word { font-weight: 600; color: var(--ink); }
.translate-entry-time { color: var(--sub); }
.translate-entry-latency { color: var(--sub); margin-left: auto; }
.translate-entry-detail {
  display: none;
  padding: 10px 14px;
  font-size: 12px;
  line-height: 1.6;
}
.translate-entry.open .translate-entry-detail { display: block; }
.translate-detail-row { display: flex; gap: 8px; margin-bottom: 4px; }
.translate-detail-label { color: var(--sub); min-width: 80px; font-size: 11px; font-family: 'JetBrains Mono', monospace; }
.translate-detail-value { color: var(--ink); word-break: break-word; }
/* Translate search toolbar */
.translate-toolbar {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.translate-toolbar input[type=text],
.translate-toolbar select {
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 4px 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  background: var(--surface);
  color: var(--ink);
}
.translate-toolbar input[type=text] { flex: 1; min-width: 140px; }
.translate-toolbar input[type=text]:focus,
.translate-toolbar select:focus { border-color: var(--ink); outline: none; }
.translate-toolbar .btn-mini { padding: 4px 10px; font-size: 11px; }
.translate-toolbar .toolbar-status { color: var(--sub); font-size: 10px; font-family: 'JetBrains Mono', monospace; margin-left: auto; }
/* Activity timeline */
#activity-feed {
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--surface);
  max-height: 400px;
  overflow-y: auto;
}
#activity-feed::-webkit-scrollbar { width: 8px; }
#activity-feed::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.activity-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  border-bottom: 1px solid var(--border-l);
}
.activity-row:last-child { border-bottom: none; }
.activity-type {
  padding: 1px 6px;
  border: 1px solid var(--border);
  border-radius: 2px;
  font-size: 10px;
  letter-spacing: .06em;
  text-transform: uppercase;
  min-width: 64px;
  text-align: center;
}
.activity-type.t-translate { background: #f6f4ef; }
.activity-type.t-pipeline { background: #eef3ed; }
.activity-type.t-judge { background: #f3eef0; }
.activity-detail { color: var(--ink); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.activity-time { color: var(--sub); margin-left: auto; }
.activity-status.s-ok { color: var(--ink); }
.activity-status.s-failed, .activity-status.s-rejected { color: var(--dev); }
.activity-controls {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
}
.activity-controls .range-tab {
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 3px 10px;
  background: var(--surface);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  cursor: pointer;
  color: var(--ink);
}
.activity-controls .range-tab.active { background: var(--ink); color: var(--surface); border-color: var(--ink); }
/* Sub-divider inside detail-section */
.detail-divider { border-top: 1px solid var(--border); margin: 8px 0; padding-top: 6px; }
/* KPI row */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  margin-bottom: 24px;
}
.kpi-card {
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--surface);
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-height: 72px;
}
.kpi-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--sub);
  text-transform: uppercase;
  letter-spacing: .10em;
}
.kpi-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.2;
}
.kpi-value.kpi-dim { color: var(--sub); }
.kpi-value.kpi-warn { color: #b8860b; }
.kpi-value.kpi-bad { color: var(--dev); }
.kpi-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--sub);
}
@media (max-width: 1080px) {
  .kpi-row { grid-template-columns: repeat(3, 1fr); }
}
/* Section header (with summary chip) — clickable for collapse */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
  padding: 4px 0 6px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
}
.section-header:hover { border-bottom-color: var(--ink); }
.section-chevron {
  display: inline-block;
  font-size: 10px;
  color: var(--sub);
  transition: transform .15s ease;
  width: 12px;
  flex-shrink: 0;
}
.section-block:not(.collapsed) > .section-header .section-chevron { transform: rotate(90deg); }
.section-block.collapsed > .section-header { margin-bottom: 0; }
.section-block.collapsed .section-body { display: none; }
.section-block.collapsed { margin-bottom: 12px; }
.section-body { }
.section-header .section-title { flex: 1; min-width: 0; }
.section-header .section-title {
  font-size: 12px;
  color: var(--ink);
  letter-spacing: .16em;
  margin-bottom: 0;
}
.section-chip {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--sub);
  letter-spacing: .04em;
}
.section-chip strong { color: var(--ink); font-weight: 500; }
.section-chip .dot { margin: 0 6px; color: var(--border); }
.section-header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}
.range-tabs {
  display: inline-flex;
  border: 1px solid var(--border);
  border-radius: 3px;
  overflow: hidden;
  background: var(--surface);
}
.range-tab {
  border: none;
  background: transparent;
  padding: 3px 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--sub);
  letter-spacing: .06em;
  cursor: pointer;
  border-right: 1px solid var(--border);
  text-transform: lowercase;
}
.range-tab:last-child { border-right: none; }
.range-tab:hover { background: #f6f4ef; color: var(--ink); }
.range-tab.active { background: var(--ink); color: var(--surface); }
/* Chevron for collapse */
.chevron {
  display: inline-block;
  font-size: 9px;
  color: var(--sub);
  transition: transform .15s ease;
  width: 10px;
}
.pipeline-run.open .chevron,
.translate-entry.open .chevron { transform: rotate(90deg); }
/* Usage detail table (right column) */
.usage-detail {
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--surface);
  overflow: hidden;
}
.usage-table {
  width: 100%;
  border-collapse: collapse;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
}
.usage-table th {
  text-align: left;
  padding: 10px 14px 8px;
  font-weight: 400;
  color: var(--sub);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .10em;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.usage-table th.num { text-align: right; }
.usage-table td {
  padding: 6px 14px;
  color: var(--ink);
  border-bottom: 1px solid var(--border-l);
}
.usage-table td.num { text-align: right; }
.usage-table td.sub { color: var(--sub); }
.usage-table tr:last-child td { border-bottom: none; }
.usage-table tfoot td {
  background: var(--bg);
  border-top: 1px solid var(--border);
  border-bottom: none;
  font-weight: 500;
  padding: 8px 14px;
}
.usage-legend {
  padding: 6px 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--sub);
  background: var(--bg);
  border-top: 1px solid var(--border-l);
}
/* Empty state for subscription */
.sub-empty {
  text-align: center;
  padding: 12px 0 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--sub);
}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-left">
    <a href="/admin" class="back-link">← 返回用戶列表</a>
    <span class="brand">Books &amp; Vocab Admin<span class="dev-dot">用戶詳情</span></span>
  </div>
</div>

<div class="main">
  <div id="loading">載入中…</div>
  <div id="app" style="display:none">

    <!-- User header -->
    <div class="user-header" id="user-header"></div>

    <!-- KPI row -->

    <!-- Two-column layout -->

      <div class="col-left">
        <div class="detail-section" id="tbl-account"></div>
        <div class="detail-section" id="tbl-subscription"></div>
        <div class="detail-section" id="tbl-quota"></div>
      </div>
      <div class="col-right">
        <!-- Usage Detail (per-type table) -->
        <div class="section-block collapsed" data-section="usage">
          <div class="section-header">
            <span class="section-chevron">▸</span>
            <div class="section-title">Usage Breakdown</div>
            <div class="section-header-right">
              <div class="range-tabs" id="usage-range-tabs" role="tablist">
                <button class="range-tab active" data-range="24h">24h</button>
                <button class="range-tab" data-range="7d">7d</button>
                <button class="range-tab" data-range="30d">30d</button>
                <button class="range-tab" data-range="all">All</button>
              </div>
              <div class="section-chip" id="usage-chip"></div>
            </div>
          </div>
          <div class="section-body">
            <div class="usage-detail" id="usage-detail"></div>
          </div>
        </div>
        <!-- AI Cost Summary (per-user, defaults to current month) -->
        <div class="section-block collapsed" data-section="cost">
          <div class="section-header">
            <span class="section-chevron">▸</span>
            <div class="section-title">AI Cost Summary</div>
            <div class="section-header-right">
              <div class="range-tabs" id="cost-range-tabs" role="tablist">
                <button class="range-tab" data-range="24h">24h</button>
                <button class="range-tab" data-range="7d">7d</button>
                <button class="range-tab" data-range="30d">30d</button>
                <button class="range-tab active" data-range="month">Month</button>
                <button class="range-tab" data-range="all">All</button>
              </div>
              <div class="section-chip" id="cost-chip"></div>

          <div class="section-body">

        </div>
        <!-- Recent Activity (merged timeline) -->
        <div class="section-block collapsed" data-section="activity">
          <div class="section-header">
            <span class="section-chevron">▸</span>
            <div class="section-title">Recent Activity</div>
            <div class="section-chip" id="activity-chip"></div>
          </div>
          <div class="section-body">
            <div class="activity-controls" id="activity-range-tabs" role="tablist" aria-label="Activity window">
              <button class="range-tab active" data-hours="24" role="tab" aria-selected="true">24h</button>
              <button class="range-tab" data-hours="72" role="tab" aria-selected="false">72h</button>
              <button class="range-tab" data-hours="168" role="tab" aria-selected="false">7d</button>

            <div id="activity-no-data" class="no-data" style="display:none">無近期活動</div>
            <div id="activity-feed" style="display:none"></div>
          </div>
        </div>
        <!-- Pipeline Analytics -->
        <div class="section-block collapsed" data-section="pipeline">
          <div class="section-header">
            <span class="section-chevron">▸</span>
            <div class="section-title">Pipeline Analytics</div>
            <div class="section-chip" id="pipeline-chip"></div>
          </div>
          <div class="section-body">
            <div id="pipeline-no-data" class="no-data" style="display:none">無 Pipeline 紀錄</div>

        <!-- Translate History -->

          <div class="section-body">
            <div class="translate-toolbar" id="translate-toolbar">
              <input type="text" id="translate-q" placeholder="搜尋 word / context…" aria-label="搜尋 word 或 context">
              <select id="translate-op" aria-label="篩選 operation">
                <option value="">all ops</option>
                <option value="translate_quick">quick</option>
                <option value="translate_phrase">phrase</option>
                <option value="translate_explain">explain</option>
              </select>
              <button class="btn btn-mini" id="translate-search-btn">搜尋</button>
              <button class="btn btn-mini" id="translate-clear-btn">清除</button>
              <span class="toolbar-status" id="translate-status"></span>
            </div>
            <div id="translate-no-data" class="no-data" style="display:none">無翻譯紀錄</div>
            <div id="translate-history" style="display:none">
              <div id="translate-entries"></div>
            </div>
          </div>
        </div>
        <!-- Graph Density -->
        <div class="section-block collapsed" data-section="density">
          <div class="section-header">
            <span class="section-chevron">▸</span>
            <div class="section-title">Graph Density</div>
            <div class="section-chip" id="density-chip"></div>
          </div>
          <div class="section-body">
            <div class="chart-wrap">
              <canvas id="density-chart" height="300"></canvas>
              <div id="density-no-data" class="no-data" style="display:none">無圖譜密度資料</div>
            </div>
          </div>
        </div>
        <!-- Graph Playback -->
        <div class="section-block collapsed" data-section="playback">
          <div class="section-header">
            <span class="section-chevron">▸</span>
            <div class="section-title">Graph Playback</div>
            <div class="section-chip" id="playback-chip"></div>
          </div>
          <div class="section-body">
            <div class="playback-wrap">
              <div class="playback-canvas-container" id="playback-container">
                <canvas id="playback-canvas"></canvas>
                <div class="graph-tooltip" id="tooltip"></div>
              </div>

                  <option value="1">1x</option>
                  <option value="5">5x</option>
                  <option value="10">10x</option>
                </select>
                <input type="range" id="timeline-slider" class="playback-slider" min="0" max="0" value="0">
                <span class="playback-label" id="event-counter">0 / 0 events</span>
                <span class="playback-label" id="time-label">—</span>

  </div>
</div>

<!-- Grant Modal -->
<div class="modal-overlay" id="grant-modal">
  <div class="modal">
    <div class="modal-title">Grant Pro Access</div>
    <input type="hidden" id="grant-uid">
    <div class="modal-field">
      <label class="modal-label">原因</label>
      <input class="modal-input" id="grant-reason" placeholder="選填">
    </div>
    <div class="modal-field">
      <label class="modal-label">到期日</label>
      <input class="modal-input" id="grant-expires" type="date">
    </div>
    <div class="modal-field">
      <label class="modal-label">授權者</label>
      <input class="modal-input" id="grant-by" value="admin">
    </div>
    <div class="modal-actions">
      <button class="btn btn-mini" onclick="closeGrantModal()">取消</button>
      <button class="btn btn-mini" onclick="submitGrant()">確認授權</button>
    </div>
  </div>
</div>

<script>
/* ── Auth ── */
const _urlToken = new URLSearchParams(location.search).get('token');
if (_urlToken) {
    sessionStorage.setItem('admin_token', _urlToken);
    history.replaceState(null, '', location.pathname);
}
const TOKEN = sessionStorage.getItem('admin_token') || '';

function adminFetch(url, options = {}) {
    const headers = { ...options.headers };
    if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
    return fetch(url, { ...options, credentials: 'same-origin', headers });
}

/* ── Extract user_id from URL ── */
const pathParts = location.pathname.split('/');
const USER_ID = decodeURIComponent(pathParts[pathParts.length - 1]);

/* ── Helpers ── */
function escapeHtml(text) {
  return String(text ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function fmt(n) {
  n = n || 0;
  if (n >= 1e6) return (n/1e6).toFixed(2)+'M';
  if (n >= 1000) return (n/1000).toFixed(1)+'k';
  return n.toLocaleString();
}
function fmtDateFull(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function quotaColor(frac) {
  if (frac >= 0.8) return 'quota-fill-high';
  if (frac >= 0.5) return 'quota-fill-mid';
  return 'quota-fill-low';
}

/* ── Grant Modal ── */
function openGrantModal(userId) {
  document.getElementById('grant-uid').value = userId;
  document.getElementById('grant-reason').value = '';
  document.getElementById('grant-expires').value = '';
  document.getElementById('grant-by').value = 'admin';
  document.getElementById('grant-modal').classList.add('open');
}
function closeGrantModal() {
  document.getElementById('grant-modal').classList.remove('open');
}
async function submitGrant() {
  const userId = document.getElementById('grant-uid').value;
  const reason = document.getElementById('grant-reason').value.trim() || null;
  const expiresVal = document.getElementById('grant-expires').value;
  const expiresAt = expiresVal ? new Date(expiresVal + 'T23:59:59Z').toISOString() : null;
  const grantedBy = document.getElementById('grant-by').value.trim() || 'admin';
  const r = await adminFetch('/api/admin/users/' + encodeURIComponent(userId) + '/admin-grant', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ reason, expires_at: expiresAt, granted_by: grantedBy }),
  });
  closeGrantModal();
  if (!r.ok) { window.alert('Grant 失敗: ' + await r.text()); return; }
  location.reload();
}
async function revokePro(userId) {
  if (!window.confirm('確定撤銷 ' + userId + ' 的管理員 Pro 權限？')) return;
  const r = await adminFetch('/api/admin/users/' + encodeURIComponent(userId) + '/admin-grant', { method: 'DELETE' });
  if (!r.ok) { window.alert('Revoke 失敗: ' + await r.text()); return; }
  location.reload();
}

/* ── Render user info ── */
function fmtPct(frac) {
  if (frac == null) return '—';
  const pct = frac * 100;
  if (pct > 0 && pct < 1) return '<1%';
  return Math.round(pct) + '%';
}

function renderUserInfo(u, judgeStats) {
  const pro = u.pro || {};
  const ag = u.admin_grant || {};
  const hasAdminGrant = !!ag.is_active;
  const hasRealSubscription = !!(pro.is_active && pro.source && pro.source !== 'admin');

  // ── Header: ID + email + actions only (no duplicate badges) ──
  document.getElementById('user-header').innerHTML = `
    <div>
      <div class="user-header-id">${escapeHtml(u.user_id)}</div>
      ${u.email ? `<div class="user-header-email">${escapeHtml(u.email)}</div>` : ''}
    </div>
    <div class="user-header-actions">
      ${hasAdminGrant
        ? `<button class="btn btn-mini btn-danger" onclick="revokePro('${escapeHtml(u.user_id)}')">Revoke Pro</button>`
        : `<button class="btn btn-mini" onclick="openGrantModal('${escapeHtml(u.user_id)}')">Grant Pro</button>`}
    </div>
  `;

  // ── KPI row ──
  renderKpiRow(u, judgeStats);

  // ── Table 1: 帳戶基本資訊 (keeps canonical details — header no longer duplicates these) ──
  const proStatusLabel = hasAdminGrant
    ? 'Admin Grant'
    : (hasRealSubscription ? (pro.plan_name || pro.status || 'active') : '未訂閱');
  document.getElementById('tbl-account').innerHTML = `
    <div class="detail-section-title">帳戶基本資訊</div>
    <div class="detail-kv"><span class="detail-k">User ID</span><span class="detail-v">${escapeHtml(u.user_id)}</span></div>
    <div class="detail-kv"><span class="detail-k">Email</span><span class="detail-v">${escapeHtml(u.email || '—')}</span></div>
    <div class="detail-kv"><span class="detail-k">Provider</span><span class="detail-v">${escapeHtml(u.provider || 'manual')}</span></div>
    <div class="detail-kv"><span class="detail-k">Pro 狀態</span><span class="detail-v">${escapeHtml(proStatusLabel)}</span></div>
    <div class="detail-kv"><span class="detail-k">最後登入</span><span class="detail-v">${fmtDateFull(u.last_login)}</span></div>
    <div class="detail-kv"><span class="detail-k">單字數</span><span class="detail-v">${u.vocab_count.toLocaleString()}</span></div>
  `;

  // ── Table 2: 訂閱狀態 — context-aware, only show fields that apply ──
  let subHtml = '<div class="detail-section-title">訂閱狀態</div>';
  if (!hasAdminGrant && !hasRealSubscription) {
    subHtml += '<div class="sub-empty">未訂閱</div>';
  } else {
    if (hasAdminGrant) {
      subHtml += `
        <div class="detail-kv"><span class="detail-k">類型</span><span class="detail-v">Admin Grant</span></div>
        <div class="detail-kv"><span class="detail-k">授權者</span><span class="detail-v">${escapeHtml(ag.granted_by || '—')}</span></div>
        <div class="detail-kv"><span class="detail-k">原因</span><span class="detail-v">${escapeHtml(ag.reason || '—')}</span></div>
        <div class="detail-kv"><span class="detail-k">授權時間</span><span class="detail-v">${fmtDateFull(ag.granted_at)}</span></div>
        <div class="detail-kv"><span class="detail-k">到期日</span><span class="detail-v">${ag.expires_at ? fmtDateFull(ag.expires_at) : '永久'}</span></div>
      `;
    }
    if (hasRealSubscription) {
      if (hasAdminGrant) subHtml += '<div class="detail-divider"><div class="detail-section-title" style="margin-bottom:4px">App Store 訂閱</div></div>';
      subHtml += `
        <div class="detail-kv"><span class="detail-k">方案</span><span class="detail-v">${escapeHtml(pro.plan_name || '—')}</span></div>
        <div class="detail-kv"><span class="detail-k">價格</span><span class="detail-v">${escapeHtml(pro.price_display || '—')}</span></div>
        <div class="detail-kv"><span class="detail-k">狀態</span><span class="detail-v">${escapeHtml(pro.status || '—')}</span></div>
        <div class="detail-kv"><span class="detail-k">到期日</span><span class="detail-v">${fmtDateFull(pro.expires_at)}</span></div>
        <div class="detail-kv"><span class="detail-k">試用</span><span class="detail-v">${pro.is_trial ? '是' : '否'}</span></div>
        <div class="detail-kv"><span class="detail-k">自動續訂</span><span class="detail-v">${pro.will_renew ? '是' : '否'}</span></div>
      `;
    }
  }
  document.getElementById('tbl-subscription').innerHTML = subHtml;

  // ── Table 3: 額度使用狀態（summary only — detail moved to right col） ──
  const q = u.quota || {used_usd:0,limit_usd:0.30,fraction_used:0,calls:{}};
  const pctDisplay = fmtPct(q.fraction_used);
  const pctWidth = Math.min(100, Math.max(0, Math.round(q.fraction_used * 100)));
  const judgeHtml = judgeStats && judgeStats.total > 0
    ? `<div class="detail-kv"><span class="detail-k">Judge 通過率</span><span class="detail-v">${(judgeStats.rate * 100).toFixed(1)}% (${judgeStats.accepted}/${judgeStats.total})</span></div>`
    : '';
  document.getElementById('tbl-quota').innerHTML = `
    <div class="detail-section-title">額度使用狀態</div>
    <div class="detail-kv"><span class="detail-k">已使用（24h）</span><span class="detail-v">$${q.used_usd.toFixed(4)} / $${q.limit_usd.toFixed(2)} (${pctDisplay})</span></div>
    <div style="margin:6px 0"><div class="bar" style="min-width:100%"><div class="bar-fill ${quotaColor(q.fraction_used)}" style="width:${pctWidth}%"></div></div></div>
    ${judgeHtml}
    <div class="detail-kv"><span class="detail-k">預估費用</span><span class="detail-v">$${u.est_cost_usd.toFixed(4)}</span></div>
  `;

  // ── Right-col: Usage Breakdown table (initial 24h load) ──
  loadUsageRange('24h');
}

let _currentUsageRange = '24h';
async function loadUsageRange(range) {
  _currentUsageRange = range;
  // Update tab active state
  document.querySelectorAll('#usage-range-tabs .range-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.range === range);
  });
  const container = document.getElementById('usage-detail');
  container.innerHTML = '<div class="no-data">載入中…</div>';
  try {
    const r = await adminFetch('/api/admin/user-usage?user_id=' + encodeURIComponent(USER_ID) + '&range=' + range);
    if (!r.ok) {
      container.innerHTML = '<div class="no-data">載入失敗 (' + r.status + ')</div>';
      return;
    }
    const data = await r.json();
    renderUsageTable(data);
  } catch (e) {
    container.innerHTML = '<div class="no-data">錯誤: ' + escapeHtml(String(e)) + '</div>';
  }
}

/* ── KPI row ── */
function renderKpiRow(u, judgeStats) {
  const q = u.quota || {used_usd:0,limit_usd:0.30,fraction_used:0};
  const pctDisplay = fmtPct(q.fraction_used);
  const quotaCls = q.fraction_used >= 0.8 ? 'kpi-bad' : (q.fraction_used >= 0.5 ? 'kpi-warn' : '');
  const judgeDisplay = judgeStats && judgeStats.total > 0
    ? (judgeStats.rate * 100).toFixed(1) + '%'
    : '—';
  const judgeSub = judgeStats && judgeStats.total > 0
    ? `${judgeStats.accepted}/${judgeStats.total} 全期`
    : '無紀錄';

  document.getElementById('kpi-row').innerHTML = `
    <div class="kpi-card">
      <div class="kpi-label">單字數</div>
      <div class="kpi-value">${u.vocab_count.toLocaleString()}</div>
      <div class="kpi-sub">notebook cards</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Judge 通過率</div>
      <div class="kpi-value ${judgeDisplay === '—' ? 'kpi-dim' : ''}">${judgeDisplay}</div>
      <div class="kpi-sub">${judgeSub}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">24h Quota</div>
      <div class="kpi-value ${quotaCls}">${pctDisplay}</div>
      <div class="kpi-sub">$${q.used_usd.toFixed(4)} / $${q.limit_usd.toFixed(2)}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Graph Density</div>
      <div class="kpi-value kpi-dim" id="kpi-density-value">—</div>
      <div class="kpi-sub" id="kpi-density-sub">載入中…</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Pipeline Avg</div>
      <div class="kpi-value kpi-dim" id="kpi-pipeline-value">—</div>
      <div class="kpi-sub" id="kpi-pipeline-sub">載入中…</div>
    </div>
  `;
}

/* ── Usage breakdown table (right col) ── */
function renderUsageTable(data) {
  const calls = (data && data.calls) || {};
  const tokens = (data && data.tokens) || {};
  const range = (data && data.range) || _currentUsageRange;
  const rangeLabelMap = {'24h': '近 24 小時', '7d': '近 7 天', '30d': '近 30 天', 'all': '全期'};
  const rangeLabel = rangeLabelMap[range] || range;
  const typeLabels = {translate_quick:'quick',translate_phrase:'phrase',translate_explain:'explain',enrich:'enrich',judge:'judge',manual_link_judge:'manual_judge',embed:'embed'};
  const order = ['translate_quick','translate_phrase','translate_explain','enrich','judge','manual_link_judge','embed'];
  const allTypes = new Set([...Object.keys(calls), ...Object.keys(tokens)]);
  const sortedTypes = [...order.filter(t => allTypes.has(t)), ...[...allTypes].filter(t => !order.includes(t))];

  const container = document.getElementById('usage-detail');
  const chip = document.getElementById('usage-chip');
  if (!sortedTypes.length) {
    container.innerHTML = '<div class="no-data">無使用紀錄</div>';
    chip.innerHTML = '';
    return;
  }

  let totalCalls = 0;
  let totalCost = 0;
  let totalIn = 0;
  let totalOut = 0;
  const rows = sortedTypes.map(t => {
    const label = typeLabels[t] || t;
    const c = calls[t];
    const tk = tokens[t];
    const n = c ? c.count : 0;
    const cost = c ? c.cost_usd : 0;
    const ti = tk ? tk.input_tokens : 0;
    const to = tk ? tk.output_tokens : 0;
    totalCalls += n;
    totalCost += cost;
    totalIn += ti;
    totalOut += to;
    return `<tr>
      <td>${escapeHtml(label)}</td>
      <td class="num">${n ? n.toLocaleString() : '—'}</td>
      <td class="num">${cost ? '$' + cost.toFixed(4) : '—'}</td>
      <td class="num sub">${ti ? fmt(ti) : '—'}</td>
      <td class="num sub">${to ? fmt(to) : '—'}</td>
    </tr>`;
  }).join('');

  container.innerHTML = `
    <table class="usage-table">
      <thead>
        <tr>
          <th>Type</th>
          <th class="num">Calls</th>
          <th class="num">Cost</th>
          <th class="num">Tok In ↑</th>
          <th class="num">Tok Out ↓</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
      <tfoot>
        <tr>
          <td>Total</td>
          <td class="num">${totalCalls.toLocaleString()}</td>

/* ── Graph Playback ── */
let _playbackData = null;
let _timeline = [];       // merged sorted events
let _currentIdx = 0;
let _playing = false;
let _playTimer = null;
let _simNodes = [];
let _simEdges = [];
let _nodeMap = {};         // word -> node obj
let _simulation = null;
let _transform = { x: 0, y: 0, k: 1 };  // zoom/pan
let _dragState = null;
let _hoveredNode = null;
let _canvasW = 0;
let _canvasH = 0;

function initPlayback(data) {
  _playbackData = data;
  const chip = document.getElementById('playback-chip');
  if (!data || (!data.nodes.length && !data.edges.length)) {
    document.getElementById('playback-controls').style.display = 'none';
    document.getElementById('playback-no-data').style.display = '';
    document.getElementById('playback-container').style.display = 'none';
    if (chip) chip.innerHTML = '';
    return;
  }
  if (chip) chip.innerHTML = `<strong>${data.nodes.length}</strong> nodes <span class="dot">·</span> <strong>${data.edges.length}</strong> edges`;

  // Build merged timeline — map API fields to internal names
  const nodeEvents = data.nodes.map(n => ({ type: 'node', data: { id: n.id, word: n.label, meaning: n.meaning, created_at: n.created_at }, time: n.created_at || '' }));
  const edgeEvents = data.edges.map(e => ({ type: 'edge', data: { source: e.from_id, target: e.to_id, kind: e.kind, created_at: e.created_at }, time: e.created_at || '' }));
  _timeline = [...nodeEvents, ...edgeEvents].sort((a, b) => a.time.localeCompare(b.time));

  const slider = document.getElementById('timeline-slider');
  slider.max = _timeline.length;
  slider.value = 0;
  updateEventCounter();

  // Setup canvas
  const container = document.getElementById('playback-container');
  const canvas = document.getElementById('playback-canvas');
  const dpr = window.devicePixelRatio || 1;
  _canvasW = container.clientWidth;
  _canvasH = container.clientHeight;
  canvas.width = _canvasW * dpr;
  canvas.height = _canvasH * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  // Init transform centered
  _transform = { x: _canvasW / 2, y: _canvasH / 2, k: 1 };

  // d3-force simulation
  _simNodes = [];
  _simEdges = [];
  _nodeMap = {};
  _simulation = d3.forceSimulation(_simNodes)
    .force('link', d3.forceLink(_simEdges).id(d => d.id).distance(80))
    .force('charge', d3.forceManyBody().strength(-120))
    .force('center', d3.forceCenter(0, 0))
    .force('collide', d3.forceCollide(20))
    .on('tick', () => drawGraph(ctx));

  // Mouse events for zoom/pan/hover
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY > 0 ? 0.9 : 1.1;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    _transform.x = mx - (mx - _transform.x) * factor;
    _transform.y = my - (my - _transform.y) * factor;
    _transform.k *= factor;
    drawGraph(ctx);
  }, { passive: false });

  canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    _dragState = { startX: e.clientX, startY: e.clientY, origX: _transform.x, origY: _transform.y };
  });
  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    if (_dragState) {
      _transform.x = _dragState.origX + (e.clientX - _dragState.startX);
      _transform.y = _dragState.origY + (e.clientY - _dragState.startY);
      drawGraph(ctx);
    }
    // Hover detection
    const gx = (mx - _transform.x) / _transform.k;
    const gy = (my - _transform.y) / _transform.k;
    let found = null;
    for (const n of _simNodes) {
      const dx = n.x - gx, dy = n.y - gy;
      if (dx * dx + dy * dy < 100) { found = n; break; }
    }
    _hoveredNode = found;
    const tooltip = document.getElementById('tooltip');
    if (found) {
      tooltip.style.display = 'block';
      tooltip.style.left = (mx + 12) + 'px';
      tooltip.style.top = (my - 10) + 'px';
      tooltip.innerHTML = `<div class="tt-word">${escapeHtml(found.word)}</div>` +
        (found.meaning ? `<div class="tt-meaning">${escapeHtml(found.meaning)}</div>` : '') +
        `<div class="tt-time">${fmtDate(found.created_at)}</div>`;
    } else {
      tooltip.style.display = 'none';
    }
    if (!_dragState) drawGraph(ctx);
  });
  canvas.addEventListener('mouseup', () => { _dragState = null; });
  canvas.addEventListener('mouseleave', () => {
    _dragState = null;
    _hoveredNode = null;
    document.getElementById('tooltip').style.display = 'none';
  });

  // Controls
  document.getElementById('btn-play').onclick = togglePlay;
  document.getElementById('speed-select').onchange = () => {
    if (_playing) { stopPlay(); startPlay(); }
  };
  document.getElementById('timeline-slider').oninput = (e) => {
    const target = parseInt(e.target.value);
    scrubTo(target, ctx);
  };

  drawGraph(ctx);
}

function togglePlay() {
  if (_playing) stopPlay(); else startPlay();
}

function startPlay() {
  if (_currentIdx >= _timeline.length) {
    _currentIdx = 0;
    scrubTo(0, getCtx());
  }
  _playing = true;
  document.getElementById('btn-play').textContent = '⏸';
  scheduleNext();
}

function stopPlay() {
  _playing = false;
  document.getElementById('btn-play').textContent = '▶';
  if (_playTimer) { clearTimeout(_playTimer); _playTimer = null; }
}

function getSpeed() {
  const v = parseInt(document.getElementById('speed-select').value) || 1;
  if (v === 10) return 50;
  if (v === 5) return 100;
  return 500;
}

function scheduleNext() {
  if (!_playing || _currentIdx >= _timeline.length) { stopPlay(); return; }
  _playTimer = setTimeout(() => {
    addEvent(_currentIdx);
    _currentIdx++;
    document.getElementById('timeline-slider').value = _currentIdx;
    updateEventCounter();
    scheduleNext();
  }, getSpeed());
}

function addEvent(idx) {
  const evt = _timeline[idx];
  if (evt.type === 'node') {
    const d = evt.data;
    if (_nodeMap[d.id]) return;
    const n = {
      id: d.id,
      word: d.word,
      meaning: d.meaning || '',
      created_at: d.created_at,
      x: (Math.random() - 0.5) * 60,
      y: (Math.random() - 0.5) * 60,
      _pulse: 1.0,
    };
    _simNodes.push(n);
    _nodeMap[d.id] = n;
    restartSim();
  } else {
    const d = evt.data;
    const src = _nodeMap[d.source];
    const tgt = _nodeMap[d.target];
    if (!src || !tgt) return;
    _simEdges.push({ source: src, target: tgt, created_at: d.created_at });
    _simulation.force('link').links(_simEdges);
    _simulation.alpha(0.3).restart();
  }
}

function restartSim() {
  _simulation.nodes(_simNodes);
  _simulation.force('link').links(_simEdges);
  _simulation.alpha(0.5).restart();
}

function scrubTo(targetIdx, ctx) {
  // Rebuild state up to targetIdx
  _simNodes.length = 0;
  _simEdges.length = 0;
  _nodeMap = {};
  for (let i = 0; i < targetIdx; i++) {
    const evt = _timeline[i];
    if (evt.type === 'node') {
      const d = evt.data;
      if (_nodeMap[d.id]) continue;
      const n = {
        id: d.id,
        word: d.word,
        meaning: d.meaning || '',
        created_at: d.created_at,
        x: (Math.random() - 0.5) * 100,
        y: (Math.random() - 0.5) * 100,
      };
      _simNodes.push(n);
      _nodeMap[d.id] = n;
    } else {
      const d = evt.data;
      const src = _nodeMap[d.source];
      const tgt = _nodeMap[d.target];
      if (src && tgt) {
        _simEdges.push({ source: src, target: tgt, created_at: d.created_at });
      }
    }
  }
  _currentIdx = targetIdx;
  updateEventCounter();
  restartSim();
}

function updateEventCounter() {
  document.getElementById('event-counter').textContent = _currentIdx + ' / ' + _timeline.length + ' events';
  if (_currentIdx > 0 && _currentIdx <= _timeline.length) {
    document.getElementById('time-label').textContent = fmtDate(_timeline[_currentIdx - 1].time);
  } else {
    document.getElementById('time-label').textContent = '—';
  }
}

function getCtx() {
  return document.getElementById('playback-canvas').getContext('2d');
}

function drawGraph(ctx) {
  ctx.save();
  ctx.clearRect(0, 0, _canvasW, _canvasH);
  // background
  ctx.fillStyle = '#f8f7f4';
  ctx.fillRect(0, 0, _canvasW, _canvasH);
  // apply transform
  ctx.translate(_transform.x, _transform.y);
  ctx.scale(_transform.k, _transform.k);
  // edges
  ctx.strokeStyle = '#dbd6cd';
  ctx.lineWidth = 1 / _transform.k;
  for (const e of _simEdges) {
    if (e.source.x == null || e.target.x == null) continue;
    ctx.beginPath();
    ctx.moveTo(e.source.x, e.source.y);
    ctx.lineTo(e.target.x, e.target.y);
    ctx.stroke();
  }
  // nodes
  for (const n of _simNodes) {
    if (n.x == null) continue;
    const isHovered = _hoveredNode === n;
    let r = 6;
    // pulse animation for newly added
    if (n._pulse && n._pulse > 0) {
      r = 6 + n._pulse * 6;
      n._pulse -= 0.05;
      if (n._pulse < 0) n._pulse = 0;
    }
    ctx.beginPath();
    ctx.arc(n.x, n.y, r / _transform.k * (isHovered ? 1.4 : 1), 0, Math.PI * 2);
    ctx.fillStyle = isHovered ? '#5a5550' : '#2a2520';
    ctx.fill();
    ctx.strokeStyle = '#fcfbfa';
    ctx.lineWidth = 1.5 / _transform.k;
    ctx.stroke();
    // label
    const fontSize = Math.max(8, 10 / _transform.k);
    ctx.font = `${fontSize}px 'JetBrains Mono', monospace`;
    ctx.fillStyle = '#5a5550';
    ctx.textAlign = 'center';
    ctx.fillText(n.word, n.x, n.y + r / _transform.k + fontSize + 2);
  }
  ctx.restore();
}

function renderWaterfall(run) {
  const totalDuration = run.duration_s || 1;
  const runStart = new Date(run.started_at).getTime();
  const steps = run.steps || [];
  if (!steps.length) return '<div style="padding:8px;color:var(--sub);font-size:11px">無步驟資料</div>';

  let html = '<div class="waterfall">';
  html += '<div class="waterfall-axis">';
  html += '<span>0s</span>';
  html += `<span>${(totalDuration * 0.25).toFixed(1)}s</span>`;
  html += `<span>${(totalDuration * 0.5).toFixed(1)}s</span>`;
  html += `<span>${(totalDuration * 0.75).toFixed(1)}s</span>`;
  html += `<span>${totalDuration.toFixed(1)}s</span>`;
  html += '</div>';

  for (const step of steps) {
    const stepStart = step.started_at ? new Date(step.started_at).getTime() : runStart;
    const leftPct = Math.max(0, Math.min(100, ((stepStart - runStart) / 1000) / totalDuration * 100));
    const widthPct = Math.min(100 - leftPct, (step.duration_s || 0) / totalDuration * 100);
    const statusClass = 's-' + (step.status || 'ok');
    const dur = step.duration_s != null ? step.duration_s.toFixed(1) + 's' : '—';
    const items = step.items ? step.items.toString() : '';

    html += '<div class="waterfall-row">';
    html += `<span class="waterfall-label">${escapeHtml(step.name)}</span>`;
    html += '<div class="waterfall-track">';
    html += `<div class="waterfall-bar ${statusClass}" style="left:${leftPct.toFixed(1)}%;width:${Math.max(widthPct, 0.5).toFixed(1)}%"></div>`;
    html += '</div>';
    html += `<span class="waterfall-meta">${dur}${items ? '  ' + items : ''}</span>`;
    html += '</div>';

    if (step.error) {
      html += `<div class="pipeline-step-error" style="margin-left:108px">${escapeHtml(step.error)}</div>`;
    }
  }
  html += '</div>';
  return html;
}

function renderPipelineAnalytics(data) {
  const noData = document.getElementById('pipeline-no-data');
  const analytics = document.getElementById('pipeline-analytics');
  const container = document.getElementById('pipeline-runs');
  const chip = document.getElementById('pipeline-chip');

  if (!data || !data.runs || data.runs.length === 0) {
    analytics.style.display = 'none';
    noData.style.display = '';
    chip.innerHTML = '';
    updateKpi('kpi-pipeline-value', '—', 'kpi-dim');
    document.getElementById('kpi-pipeline-sub').textContent = '無紀錄';
    return;
  }
  noData.style.display = 'none';
  analytics.style.display = '';

  const runs = data.runs;

  // Summary stats
  const total = runs.length;
  const completed = runs.filter(r => r.status === 'completed').length;
  const successRate = total > 0 ? (completed / total * 100).toFixed(0) : 0;
  const durations = runs.filter(r => r.duration_s != null).map(r => r.duration_s);
  const avgDur = durations.length ? (durations.reduce((a,b)=>a+b,0) / durations.length) : 0;
  chip.innerHTML = `<strong>${total}</strong> runs <span class="dot">·</span> <strong>${successRate}%</strong> success <span class="dot">·</span> avg <strong>${avgDur.toFixed(1)}s</strong>`;

  // Update KPI
  updateKpi('kpi-pipeline-value', avgDur.toFixed(1) + 's', '');
  document.getElementById('kpi-pipeline-sub').textContent = `${total} runs · ${successRate}% ok`;

  container.innerHTML = runs.map((run, idx) => {
    const statusClass = 's-' + run.status;
    const statusIcon = run.status === 'completed' ? '✓' : run.status === 'failed' ? '✗' : run.status === 'interrupted' ? '⚠' : '⏳';
    const duration = run.duration_s != null ? run.duration_s.toFixed(1) + 's' : '—';
    const time = fmtDate(run.started_at);
    const runItems = (run.steps || []).reduce((s, st) => s + (st.items || 0), 0);

    return `<div class="pipeline-run" id="prun-${idx}">
      <div class="pipeline-run-header" onclick="toggleCollapse('prun-${idx}', this)" role="button" tabindex="0" aria-expanded="false">
        <span class="chevron">▸</span>
        <span class="pipeline-run-trigger">${escapeHtml(run.trigger)}</span>
        <span class="pipeline-run-time">${time}</span>
        <span class="pipeline-run-status ${statusClass}">${statusIcon} ${run.status}</span>
        <span class="pipeline-run-items" style="color:var(--sub)">${runItems ? runItems + ' items' : ''}</span>
        <span class="pipeline-run-duration">${duration}</span>
      </div>
      <div class="pipeline-run-steps">${renderWaterfall(run)}</div>
    </div>`;
  }).join('');
}

function updateKpi(id, value, cls) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = value;
  el.className = 'kpi-value ' + (cls || '');
}

/* ── Translate History ── */
function renderTranslateHistory(data) {
  const noData = document.getElementById('translate-no-data');
  const section = document.getElementById('translate-history');
  const container = document.getElementById('translate-entries');
  const chip = document.getElementById('translate-chip');

  if (!data || !data.history || data.history.length === 0) {
    section.style.display = 'none';
    noData.style.display = '';
    chip.innerHTML = '';
    return;
  }
  noData.style.display = 'none';
  section.style.display = '';

  // Summary
  const total = data.history.length;
  const latencies = data.history.filter(e => e.latency_ms != null).map(e => e.latency_ms);
  const avgLat = latencies.length ? Math.round(latencies.reduce((a,b)=>a+b,0) / latencies.length) : 0;
  chip.innerHTML = `<strong>${total}</strong> ops <span class="dot">·</span> avg <strong>${avgLat}ms</strong>`;

  const opLabel = { translate_quick: 'quick', translate_phrase: 'phrase', translate_explain: 'explain' };

  container.innerHTML = data.history.map((entry, idx) => {
    const op = opLabel[entry.operation] || entry.operation;
    const time = fmtDate(entry.created_at);
    const latency = entry.latency_ms != null ? entry.latency_ms + 'ms' : '—';
    let parsed;
    try { parsed = JSON.parse(entry.response_raw); } catch { parsed = {}; }
    const result = parsed.t || parsed.e || '—';
    const context = entry.context ? entry.context : '—';

    return `<div class="translate-entry" id="tentry-${idx}">
      <div class="translate-entry-header" onclick="toggleCollapse('tentry-${idx}', this)" role="button" tabindex="0" aria-expanded="false">
        <span class="chevron">▸</span>
        <span class="translate-entry-op">${op}</span>
        <span class="translate-entry-word">${escapeHtml(entry.word)}</span>
        <span style="color:var(--sub);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">→ ${escapeHtml(result)}</span>
        <span class="translate-entry-time">${time}</span>
        <span class="translate-entry-latency">${latency}</span>
      </div>
      <div class="translate-entry-detail">
        <div class="translate-detail-row"><span class="translate-detail-label">langs</span><span class="translate-detail-value">${escapeHtml(entry.source_lang)} → ${escapeHtml(entry.target_lang)}</span></div>
        <div class="translate-detail-row"><span class="translate-detail-label">context</span><span class="translate-detail-value">${escapeHtml(context)}</span></div>
        <div class="translate-detail-row"><span class="translate-detail-label">response</span><span class="translate-detail-value" style="font-family:'JetBrains Mono',monospace;font-size:11px">${escapeHtml(entry.response_raw)}</span></div>
      </div>
    </div>`;
  }).join('');
}

/* ── Recent Activity timeline ── */
let _activityHours = 24;

function fmtRelTime(iso) {
  if (!iso) return '—';
  try {
    const diffMs = Date.now() - new Date(iso).getTime();
    const sec = Math.max(0, Math.round(diffMs / 1000));
    if (sec < 60) return sec + 's ago';
    const min = Math.round(sec / 60);
    if (min < 60) return min + 'm ago';
    const hr = Math.round(min / 60);
    if (hr < 48) return hr + 'h ago';
    return Math.round(hr / 24) + 'd ago';
  } catch { return '—'; }
}

function renderActivityTimeline(data) {
  const noData = document.getElementById('activity-no-data');
  const feed = document.getElementById('activity-feed');
  const chip = document.getElementById('activity-chip');
  if (!data || !data.events || data.events.length === 0) {
    feed.style.display = 'none';
    noData.style.display = '';
    chip.innerHTML = data && data.hours ? `<span class="dot">·</span> last ${data.hours}h` : '';
    return;
  }
  noData.style.display = 'none';
  feed.style.display = '';
  const c = data.counts || {};
  chip.innerHTML = `<strong>${data.events.length}</strong> events <span class="dot">·</span> ${c.translate||0} tr · ${c.pipeline||0} pl · ${c.judge||0} jd <span class="dot">·</span> ${data.hours}h`;

  feed.innerHTML = data.events.map(ev => {
    let detail = '';
    let statusCls = '';
    if (ev.type === 'translate') {
      const op = ev.operation ? ev.operation.replace('translate_','') : '?';
      detail = `<span style="color:var(--sub)">[${escapeHtml(op)}]</span> ${escapeHtml(ev.word || '')}`;
    } else if (ev.type === 'pipeline') {
      statusCls = ev.status === 'ok' || ev.status === 'completed' ? 's-ok' : (ev.status === 'failed' ? 's-failed' : '');
      const dur = ev.duration_s != null ? ` · ${ev.duration_s}s` : '';
      detail = `<span class="activity-status ${statusCls}">${escapeHtml(ev.status||'?')}</span><span style="color:var(--sub)"> · ${escapeHtml(ev.trigger||'?')} · ${escapeHtml(ev.run_id||'')}${dur}</span>`;
    } else if (ev.type === 'judge') {
      statusCls = ev.accepted ? 's-ok' : 's-rejected';
      const conf = ev.confidence != null ? ` · conf ${ev.confidence.toFixed(2)}` : '';
      detail = `<span class="activity-status ${statusCls}">${ev.accepted ? 'accept' : 'reject'}</span><span style="color:var(--sub)"> · ${escapeHtml(ev.verdict||'?')}${conf}</span>`;
    } else {
      detail = escapeHtml(JSON.stringify(ev));
    }
    return `<div class="activity-row">
      <span class="activity-type t-${ev.type}">${ev.type}</span>
      <span class="activity-detail">${detail}</span>
      <span class="activity-time" title="${escapeHtml(ev.created_at||'')}">${fmtRelTime(ev.created_at)}</span>
    </div>`;
  }).join('');
}

async function loadActivity(hours) {
  _activityHours = hours;
  try {
    const r = await adminFetch('/api/admin/user-activity?user_id=' + encodeURIComponent(USER_ID) + '&hours=' + hours);
    if (!r.ok) { renderActivityTimeline(null); return; }
    const data = await r.json();
    renderActivityTimeline(data);
  } catch { renderActivityTimeline(null); }
}

/* ── Translate history search ── */
let _translateSearchSeq = 0;

async function searchTranslate() {
  const q = (document.getElementById('translate-q').value || '').trim();
  const op = document.getElementById('translate-op').value || '';
  const status = document.getElementById('translate-status');
  const seq = ++_translateSearchSeq;
  status.textContent = '搜尋中…';
  const params = new URLSearchParams({ user_id: USER_ID, limit: '200' });
  if (q) params.set('q', q);
  if (op) params.set('op', op);
  try {
    const r = await adminFetch('/api/admin/translate-history?' + params.toString());
    if (seq !== _translateSearchSeq) return; // stale
    if (!r.ok) {
      status.textContent = '錯誤 ' + r.status;
      renderTranslateHistory(null);
      return;
    }
    const data = await r.json();
    renderTranslateHistory(data);
    const n = (data.history || []).length;
    const count = data.truncated ? `顯示 ${n} / 共 ${data.total} 筆` : `${n} 筆`;
    status.textContent = (q || op) ? `${count} (filtered)` : count;
  } catch (e) {
    if (seq !== _translateSearchSeq) return;
    status.textContent = '錯誤';
  }
}

function clearTranslateSearch() {
  document.getElementById('translate-q').value = '';
  document.getElementById('translate-op').value = '';
  searchTranslate();
}

async function loadPage() {
  try {
    const [statsR, densityR, playbackR, pipelineR, judgeR, translateR, activityR, costR] = await Promise.all([
      adminFetch('/api/admin/stats'),
      adminFetch('/api/admin/graph-density?user_id=' + encodeURIComponent(USER_ID) + '&notebook_id=default'),
      adminFetch('/api/admin/graph-playback?user_id=' + encodeURIComponent(USER_ID) + '&notebook_id=default'),
      adminFetch('/api/admin/pipeline-runs?user_id=' + encodeURIComponent(USER_ID)),
      adminFetch('/api/admin/judge-stats?user_id=' + encodeURIComponent(USER_ID)),
      adminFetch('/api/admin/translate-history?user_id=' + encodeURIComponent(USER_ID)),
      adminFetch('/api/admin/user-activity?user_id=' + encodeURIComponent(USER_ID) + '&hours=24'),
      adminFetch('/api/admin/user-cost-summary?user_id=' + encodeURIComponent(USER_ID) + '&range=month'),
    ]);

    if (!statsR.ok) {
      document.getElementById('loading').textContent = 'Error ' + statsR.status + ': ' + await statsR.text();
      return;
    }
    const statsData = await statsR.json();
    const user = statsData.users.find(u => u.user_id === USER_ID);
    if (!user) {
      document.getElementById('loading').textContent = '找不到用戶: ' + USER_ID;
      return;
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = '';
    document.title = user.email || user.user_id;

    const judgeStats = judgeR.ok ? await judgeR.json() : null;
    renderUserInfo(user, judgeStats);

    // Density — stash data, update KPI/chip only; actual chart rendered on first expand
    _deferredDensityData = densityR.ok ? await densityR.json() : null;
    previewDensity(_deferredDensityData);

    // Playback — stash, preview only; canvas init deferred to first expand
    _deferredPlaybackData = playbackR.ok ? await playbackR.json() : null;
    previewPlayback(_deferredPlaybackData);

    // Pipeline + Translate render into hidden containers fine (no canvas)
    if (pipelineR.ok) {
      const pipelineData = await pipelineR.json();
      renderPipelineAnalytics(pipelineData);
    } else {
      renderPipelineAnalytics(null);
    }

    if (translateR.ok) {
      const translateData = await translateR.json();
      renderTranslateHistory(translateData);
      const n = (translateData.history || []).length;
      const status = document.getElementById('translate-status');
      if (status) status.textContent = translateData.truncated ? `顯示 ${n} / 共 ${translateData.total} 筆` : n + ' 筆';
    } else {
      renderTranslateHistory(null);
    }

    if (activityR.ok) {
      const activityData = await activityR.json();
      renderActivityTimeline(activityData);
    } else {
      renderActivityTimeline(null);
    }

    if (costR.ok) {
      renderCostSummary(await costR.json());
    } else {
      renderCostSummary(null);
    }

  } catch (e) {
    document.getElementById('loading').textContent = 'Error: ' + e;
  }
}

document.getElementById('grant-modal').addEventListener('click', function(e) {
  if (e.target === this) closeGrantModal();
});

/* ── Range tab click handler (stop propagation so section doesn't toggle) ── */
document.getElementById('usage-range-tabs').addEventListener('click', function(e) {
  e.stopPropagation();
  const btn = e.target.closest('.range-tab');
  if (!btn) return;
  const range = btn.dataset.range;
  // Auto-open usage section if collapsed
  const block = btn.closest('.section-block');
  if (block && block.classList.contains('collapsed')) block.classList.remove('collapsed');
  if (range && range !== _currentUsageRange) loadUsageRange(range);
});

document.getElementById('cost-range-tabs').addEventListener('click', function(e) {
  e.stopPropagation();
  const btn = e.target.closest('.range-tab');
  if (!btn) return;
  const range = btn.dataset.range;
  const block = btn.closest('.section-block');
  if (block && block.classList.contains('collapsed')) block.classList.remove('collapsed');
  if (range && range !== _currentCostRange) loadCostRange(range);
});

/* ── Section collapse toggle (click on section-header) ── */
document.querySelectorAll('.col-right .section-block').forEach(block => {
  const header = block.querySelector('.section-header');
  if (!header) return;
  header.addEventListener('click', () => {
    const willOpen = block.classList.contains('collapsed');
    block.classList.toggle('collapsed');
    if (willOpen) {
      const section = block.dataset.section;
      if (section) onSectionExpand(section);
    }
  });
});

/* ── Keyboard support for collapse headers ── */
document.addEventListener('keydown', function(e) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const t = e.target;
  if (!t || !t.classList) return;
  if (t.classList.contains('pipeline-run-header') || t.classList.contains('translate-entry-header')) {
    e.preventDefault();
    t.click();
  }
});

/* ── Toggle helper: class + aria-expanded in one call ── */
function toggleCollapse(containerId, header) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.classList.toggle('open');
  header.setAttribute('aria-expanded', el.classList.contains('open') ? 'true' : 'false');
}

/* ── Translate search wiring ── */
(function wireTranslateSearch() {
  const btn = document.getElementById('translate-search-btn');
  const clearBtn = document.getElementById('translate-clear-btn');
  const q = document.getElementById('translate-q');
  const op = document.getElementById('translate-op');
  if (!btn || !q) return;
  // Stop the toolbar clicks from collapsing the section.
  const toolbar = document.getElementById('translate-toolbar');
  if (toolbar) toolbar.addEventListener('click', e => e.stopPropagation());
  btn.addEventListener('click', e => { e.preventDefault(); searchTranslate(); });
  clearBtn.addEventListener('click', e => { e.preventDefault(); clearTranslateSearch(); });
  q.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); searchTranslate(); } });
  op.addEventListener('change', () => searchTranslate());
})();

/* ── Activity range tabs wiring ── */
(function wireActivityRange() {
  const tabs = document.getElementById('activity-range-tabs');
  if (!tabs) return;
  tabs.addEventListener('click', function(e) {
    e.stopPropagation();
    const btn = e.target.closest('.range-tab');
    if (!btn) return;
    const hours = parseInt(btn.dataset.hours, 10);
    if (!hours || hours === _activityHours) return;
    tabs.querySelectorAll('.range-tab').forEach(t => {
      const on = t === btn;
      t.classList.toggle('active', on);
      t.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    // Auto-open section if collapsed
    const block = btn.closest('.section-block');
    if (block && block.classList.contains('collapsed')) block.classList.remove('collapsed');
    loadActivity(hours);
  });
})();

loadPage();
</script>
