name: backend-quality

# Keep the backend quality surface narrow. Backend source/tests, its locked
# toolchain, the backend-facing devops skill roster contract, and this workflow
# are the only changes that need this runner.

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.claude/skills/devops/SKILL.md'
      # Cross-tree files read by backend tests (Issue #2326); mirror ops/ci_scope_router.sh.
      - 'ops/data_inspect.py'
      - 'ops/official_decks/**'
      - 'ops/seeds/marketing_demo.json'
      - 'ops/podcast_preview_backfill.py'
      - 'docs/registry.yml'
      - 'docs/reference/testing/backend_strategy.md'
      - 'docs/sop/architecture.md'
      - 'ios/BooksAndVocab/Views/Podcast/PodcastAccess.swift'
      - '.github/workflows/backend-quality.yml'
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  backend-quality:
    # Pinned image, not the moving `ubuntu-latest` label: the apt archive the
    # ffmpeg step installs from (and so its ffmpeg series) follows the image.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        id: setup_uv
        continue-on-error: true
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.8.23'

      - name: Install locked backend environment
        id: sync
        continue-on-error: true
        run: uv sync --locked

      - name: Install ffmpeg and ffprobe
        id: media_tools
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        # tests/test_podcast_preview_backfill.py skips without both binaries;
        # the skip allowlist turns such a skip into a red run (#2115). Debian's
        # `ffmpeg` package ships ffmpeg and ffprobe.
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg
          for tool in ffmpeg ffprobe; do
            version="$("$tool" -hide_banner -version)"
            printf '%s: %s\n' "$tool" "${version%%$'\n'*}"
          done

      - name: Capture backend quality provenance
        id: provenance
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          head_sha="$(git rev-parse HEAD)"
          lock_blob_sha="$(git rev-parse HEAD:backend/uv.lock)"
          lock_sha256="$(cd "$GITHUB_WORKSPACE" && sha256sum backend/uv.lock | awk '{print $1}')"
          uv_version="$(uv --version 2>&1 || true)"
          python_version="$(uv run python --version 2>&1)"
          python_executable="$(uv run python -c 'import sys; print(sys.executable)')"
          ffmpeg_version="$( (ffmpeg -hide_banner -version 2>&1 || true) | sed -n '1p')"
          {
            printf 'HEAD_SHA=%s\n' "$head_sha"
            printf 'GITHUB_SHA=%s\n' "$GITHUB_SHA"
            printf 'LOCK_BLOB_SHA=%s\n' "$lock_blob_sha"
            printf 'LOCK_SHA256=%s\n' "$lock_sha256"
            printf 'UV_VERSION=%s\n' "$uv_version"
            printf 'PYTHON_VERSION=%s\n' "$python_version"
            printf 'PYTHON_EXECUTABLE=%s\n' "$python_executable"
            printf 'FFMPEG_VERSION=%s\n' "$ffmpeg_version"
            printf 'RUN_ID=%s\n' "$GITHUB_RUN_ID"
            printf 'RUN_ATTEMPT=%s\n' "$GITHUB_RUN_ATTEMPT"
          } | tee ci-artifacts/backend-quality-provenance.txt
          {
            echo '### Backend interpreter provenance'
            echo "- python --version: \`$python_version\`"
            echo "- sys.executable: \`$python_executable\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run backend tests and collect coverage
        id: tests
        if: steps.sync.outcome == 'success' && steps.media_tools.outcome == 'success' && steps.provenance.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          COVERAGE_FILE: ${{ runner.temp }}/backend-quality/.coverage
        # One suite for every trigger: the nightly schedule is a drift detector
        # over the same tests push and pull_request run, not a narrower lane.
        # -rs prints every skip reason; --skip-allowlist fails the run on any
        # skip without an issue-linked entry in tests/skip_allowlist.json.
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$COVERAGE_FILE")"
          uv run python -m pytest -q -rs --skip-allowlist=tests/skip_allowlist.json --cov=src/kg --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Enforce coverage threshold
        id: coverage
        if: steps.sync.outcome == 'success' && steps.tests.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          COVERAGE_FILE: ${{ runner.temp }}/backend-quality/.coverage
        run: |
          set -euo pipefail
          uv run python -m coverage report --fail-under=85
          test -s coverage.xml

      - name: Run Ruff
        id: ruff
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        run: uv run ruff check src tests

      - name: Classify backend quality result
        id: verdict
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_UV_OUTCOME: ${{ steps.setup_uv.outcome }}
          PROVENANCE_OUTCOME: ${{ steps.provenance.outcome }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          MEDIA_TOOLS_OUTCOME: ${{ steps.media_tools.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
          RUFF_OUTCOME: ${{ steps.ruff.outcome }}
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          status="pass"
          detail="tests, coverage, and Ruff passed"

          if [[ "$CHECKOUT_OUTCOME" != "success" || "$SETUP_UV_OUTCOME" != "success" || "$PROVENANCE_OUTCOME" != "success" || "$SYNC_OUTCOME" != "success" || "$MEDIA_TOOLS_OUTCOME" != "success" ]]; then
            status="infrastructure-inconclusive"
            detail="checkout, uv setup, provenance, locked sync, or ffmpeg install was inconclusive"
          elif [[ "$TEST_OUTCOME" == "failure" ]]; then
            status="test-failure"
            detail="backend test command failed; existing full-suite failures remain failures"
          elif [[ "$TEST_OUTCOME" != "success" ]]; then
            status="infrastructure-inconclusive"
            detail="backend test step did not produce a success outcome"
          elif [[ "$COVERAGE_OUTCOME" == "failure" ]]; then
            status="coverage-failure"
            detail="coverage threshold command failed"
          elif [[ "$COVERAGE_OUTCOME" != "success" ]]; then
            status="infrastructure-inconclusive"
            detail="coverage step did not produce a success outcome"
          elif [[ "$RUFF_OUTCOME" == "failure" ]]; then
            status="ruff-failure"
            detail="Ruff check failed"
          elif [[ "$RUFF_OUTCOME" != "success" ]]; then
            status="infrastructure-inconclusive"
            detail="Ruff step did not produce a success outcome"
          fi

          printf 'STATUS=%s\nDETAIL=%s\n' "$status" "$detail" > ci-artifacts/backend-quality-verdict.txt
          {
            echo '### Backend quality verdict'
            echo "- status: \`$status\`"
            echo "- $detail"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$status" != "pass" ]]; then
            exit 1
          fi

      - name: Upload backend quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-quality-${{ github.sha }}
          path: |
            backend/coverage.xml
            backend/ci-artifacts/
          if-no-files-found: error
          retention-days: 14

  # The production image must install exactly backend/uv.lock (#2088): build it
  # from this commit and compare its importlib.metadata view with the lock. Only
  # the image-test group is allowed (pytest for /admin/tests inside the container),
  # at locked versions; anything else in `dev` is reported as unexpected.
  image-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout image source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv for the image check
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.8.23'

      - name: Build production image
        run: docker build --tag kg-api:image-lock .

      - name: Assert image installs exactly uv.lock
        run: uv run --locked python scripts/check_image_lock.py --image kg-api:image-lock --allow-group image-test
