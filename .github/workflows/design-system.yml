name: design-system

# 設計系統跨平台完整性 gate。iOS Swift 為 SoT；此 workflow 確保 tokens.json 鏡像 iOS、
# 生成 CSS 無 stale、web primitive 組裝對齊 iOS 元件契約。
# 只在相關路徑變動時跑。本地等價入口：ops/verify_design_system.sh（pre-commit 亦用）。

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'design-system/**'
      - 'ops/gen_web_tokens.py'
      - 'ops/gen_figma_sets.py'
      - 'ops/token_drift_check.py'
      - 'ops/component_fidelity_check.py'
      - 'ops/verify_design_system.sh'
      - 'ios/BooksAndVocab/Models/**'
      - 'ios/BooksAndVocab/UIComponents/**'
      - 'backend/static/kg-tokens.css'
      - 'backend/static/kg-components.css'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/design-system.yml'
# checkout 讀 repo 即足；setup-uv／setup-node 只讀公開 release，不需額外 scope。
permissions:
  contents: read

# 只有 push 共用一個群組：較新的 main push 只取代仍在排隊的舊 run（#3547）。
concurrency:
  group: ${{ github.event_name == 'push' && 'design-system-main-push' || format('design-system-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install npm dependencies
        run: npm ci
      - name: Verify design-system integrity
        run: ops/verify_design_system.sh
