name: llm-eval

# The workbench is an independent Python project.  Keep its CI boundary
# narrow: changing the eval lab or this workflow must run the contract suite,
# while unrelated backend and iOS changes should not spend a runner minute.

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'lab/llm_eval/**'
      - '.github/workflows/llm-eval.yml'
permissions:
  contents: read

# 只有 push 共用一個群組：較新的 main push 只取代仍在排隊的舊 run（#3547）。
concurrency:
  group: ${{ github.event_name == 'push' && 'llm-eval-main-push' || format('llm-eval-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: false

jobs:
  llm-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: lab/llm_eval
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install frozen development environment
        run: uv sync --frozen --extra dev
      - name: Run LLM-eval CI contract
        run: uv run --frozen --extra dev pytest -q tests/test_ci_contract.py
