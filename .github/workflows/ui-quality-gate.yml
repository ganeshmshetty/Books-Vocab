name: ui-quality-gate

# 對 iOS UI 改動自動執行 manual static-code quality gates。
# 本地等價入口：./ops/ui_quality_gate.sh --tier fast --execute

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'ios/BooksAndVocab/**'
      # 這條**不是** 'ios/BooksAndVocab/**' 的子集：那個 glob 要求 BooksAndVocab 後面
      # 緊接 '/'，所以 ios/BooksAndVocabUITests/ 完全不命中。少了它，只動 UI 測試的
      # push/PR 根本不觸發本 workflow —— 而那正是 static.ui_fixture_id 存在要擋的
      # 那一種 diff（12166519f 改的就是 BooksAndVocabUITests.swift）。
      - 'ios/BooksAndVocabUITests/**'
      - 'ops/ui_quality_gate.py'
      - 'ops/ui_quality_gate.sh'
      - 'ops/ui_quality_plane.py'
      - 'ops/ui_quality_plane.yml'
      - 'ops/ui_token_lint.py'
      - 'ops/ui_token_lint.sh'
      - 'ops/plain_deadzone_lint.py'
      - 'ops/plain_deadzone_lint.sh'
      - 'ops/tap_a11y_lint.py'
      - 'ops/tap_a11y_lint.sh'
      - 'ops/_swift_scan.py'
      - 'ops/i18n_lint.sh'
      - 'ops/_i18n_*.py'
      - 'ops/catalyst_lint.sh'
      - 'ops/injection_lint.py'
      - 'ops/injection_lint.sh'
      - 'ops/_inject_shared.py'
      - 'ops/ui_fixture_lint.sh'
      - '.github/workflows/ui-quality-gate.yml'
      - '.githooks/pre-commit'
# checkout 讀 repo 即足；lint 步驟不呼叫 GitHub API。
permissions:
  contents: read

# 只有 push 共用一個群組：較新的 main push 只取代仍在排隊的舊 run（#3547）。
concurrency:
  group: ${{ github.event_name == 'push' && 'ui-quality-gate-main-push' || format('ui-quality-gate-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Verify ripgrep
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends ripgrep
          fi
          rg --version
      # --all-mechanisms, not a diff. The fast lints each scan the whole
      # tree against their baseline, so scoping by diff saved nothing and cost
      # everything: `--since origin/main` on a shallow checkout resolved to an
      # empty range, selected zero mechanisms and reported green on every run
      # from 2026-06-14 to 2026-07-17. `on: paths:` above already decides when
      # this job is relevant — same shape as design-system.yml.
      - name: Run UI quality fast gates
        run: ./ops/ui_quality_gate.sh --tier fast --execute --all-mechanisms
