name: agent-review

# This workflow is deliberately evaluated from the trusted base branch. It
# never checks out or executes pull-request code. The check records whether the
# configured independent review agent examined this exact PR head.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: write

concurrency:
  group: agent-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  agent-review-evidence:
    name: agent-review
    # A human-triggered request gives the external reviewer time to answer;
    # review/review-comment events re-evaluate the same exact head. Ordinary
    # issue comments must not manufacture a review check.
    if: >-
      github.event_name != 'issue_comment' ||
      contains(github.event.comment.body, '@codex review') ||
      (
        (
          github.event.comment.user.login == 'chatgpt-codex-connector[bot]' ||
          github.event.comment.user.login == 'chatgpt-codex-connector'
        ) &&
        contains(github.event.comment.body, '**Reviewed commit:**')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # The repository workflow contract requires pinned actions.  Only the
      # trusted default branch is checked out; no pull-request ref is ever
      # executed by this workflow.  setup-uv is pinned for the same supply
      # chain contract even though this evidence-only job uses shell tooling.
      - name: Check out trusted default branch metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Set up pinned uv runtime
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Evaluate exact-head independent review evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVIDENCE_AFTER: ${{ github.event.pull_request.updated_at || github.event.comment.created_at || github.event.review.submitted_at || github.event.pull_request_review_comment.created_at }}
          REVIEW_BOT: chatgpt-codex-connector[bot]
          REVIEW_BOT_CURRENT: chatgpt-codex-connector
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "invalid pull request number: $PR_NUMBER" >&2
            exit 1
          fi

          # Evidence queries retry transient GitHub 5xx responses with
          # exponential backoff; any other failure returns immediately.
          gh_api_retry() {
            local attempt=1 delay=2 rc=0 out err_file
            err_file="$(mktemp "${RUNNER_TEMP:-/tmp}/gh-api-err.XXXXXX")"
            while :; do
              rc=0
              out="$(gh api "$@" 2>"$err_file")" || rc=$?
              if [[ "$rc" -eq 0 ]]; then
                rm -f "$err_file"
                printf '%s\n' "$out"
                return 0
              fi
              if [[ "$attempt" -ge 4 ]] || ! grep -Eq 'HTTP 5[0-9]{2}' "$err_file"; then
                cat "$err_file" >&2
                rm -f "$err_file"
                return "$rc"
              fi
              echo "transient GitHub API 5xx (attempt $attempt), retrying in ${delay}s" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          pr_json="$(gh_api_retry "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          head_sha="$(jq -r '.head.sha // empty' <<<"$pr_json")"
          head_ref="$(jq -r '.head.ref // empty' <<<"$pr_json")"
          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "PR head is not an exact commit SHA" >&2
            exit 1
          fi

          commit_json="$(gh_api_retry "repos/$REPOSITORY/commits/$head_sha")"
          head_timestamp="$(jq -r '.commit.committer.date // .commit.author.date // empty' <<<"$commit_json")"
          evidence_after="$EVIDENCE_AFTER"
          if [[ -z "$evidence_after" ]]; then
            evidence_after="$head_timestamp"
          fi
          if [[ -z "$evidence_after" ]]; then
            echo "PR head has no evidence timestamp" >&2
            exit 1
          fi

          # The Actions job emits the optional advisory `agent-review` context.
          # This provenance-rich check remains quality observation data; the
          # repository's only required authority is the short `required` gate.
          check_completed=0
          create_check() {
            local status="$1"
            local conclusion="${2:-}"
            local title="$3"
            local summary="$4"
            local details_url="https://github.com/$REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            local external_id="kg.agent-review.v1:$GITHUB_RUN_ID:$head_sha"
            if [[ "$status" == "completed" ]]; then
              jq -n \
                --arg name "agent-review" \
                --arg head_sha "$head_sha" \
                --arg conclusion "$conclusion" \
                --arg title "$title" \
                --arg summary "$summary" \
                --arg details_url "$details_url" \
                --arg external_id "$external_id" \
                '{name:$name, head_sha:$head_sha, status:"completed", conclusion:$conclusion, details_url:$details_url, external_id:$external_id, output:{title:$title, summary:$summary}}' \
                | gh api "repos/$REPOSITORY/check-runs" --method POST --input - >/dev/null
              check_completed=1
            else
              jq -n \
                --arg name "agent-review" \
                --arg head_sha "$head_sha" \
                --arg title "$title" \
                --arg summary "$summary" \
                --arg details_url "$details_url" \
                --arg external_id "$external_id" \
                '{name:$name, head_sha:$head_sha, status:"in_progress", details_url:$details_url, external_id:$external_id, output:{title:$title, summary:$summary}}' \
                | gh api "repos/$REPOSITORY/check-runs" --method POST --input - >/dev/null
            fi
          }

          create_check in_progress "" "Waiting for independent agent review" \
            "Review evidence is evaluated only for exact head $head_sha ($head_ref)."

          # Once the in_progress placeholder exists, any abort (an exhausted
          # retry, a jq or API error) must still complete the same check,
          # otherwise it stays in_progress forever. Completion paths set
          # check_completed=1, so only unfinished runs reach this branch.
          finalize_unfinished_check() {
            local rc=$?
            if [[ "$check_completed" -ne 1 ]]; then
              create_check completed neutral "Independent agent review unavailable" \
                "Exact head $head_sha evaluation stopped before a verdict (exit $rc); advisory only." || true
              echo "Independent agent review evaluation aborted (exit $rc) for exact head $head_sha; advisory only." >&2
            fi
            exit "$rc"
          }
          trap finalize_unfinished_check EXIT

            review_evidence=""
            reviewed_issue_evidence=""
            blocker_evidence=""
            reaction_evidence=""
            # Preserve the historical jq predicate shape while extending its
            # explicit allowlist for the current connector login:
            # select(.user.login == $bot and (.created_at // "") >= $since and
            # select(.user.login == $bot and (.created_at // "") >= $since and
            # ((.body // "") | contains("**Reviewed commit:** `" + $prefix)))] | length
            # ((.body // "") | contains("**Reviewed commit:** `" + $prefix))) | (.body // "")
            for attempt in $(seq 1 20); do
            reviews="$(gh_api_retry --paginate --slurp "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews" | jq 'add // []')"
            review_comments="$(gh_api_retry --paginate --slurp "repos/$REPOSITORY/pulls/$PR_NUMBER/comments" | jq 'add // []')"
            issue_comments="$(gh_api_retry --paginate --slurp "repos/$REPOSITORY/issues/$PR_NUMBER/comments" | jq 'add // []')"
            reactions="$(gh_api_retry --paginate --slurp "repos/$REPOSITORY/issues/$PR_NUMBER/reactions" | jq 'add // []')"
            head_prefix="${head_sha:0:10}"
            current_review_ids="$(jq -c \
              --arg bot "$REVIEW_BOT" --arg current_bot "$REVIEW_BOT_CURRENT" --arg head "$head_sha" \
              '[.[] | select((.user.login == $bot or .user.login == $current_bot) and .commit_id == $head) | .id]' \
              <<<"$reviews")"

            review_evidence="$(jq -r \
              --arg bot "$REVIEW_BOT" --arg current_bot "$REVIEW_BOT_CURRENT" --arg head "$head_sha" \
              '[.[] | select((.user.login == $bot or .user.login == $current_bot) and .commit_id == $head and (.state == "APPROVED" or .state == "COMMENTED"))] | length' \
              <<<"$reviews")"
            reviewed_issue_evidence="$(jq -r \
              --arg bot "$REVIEW_BOT" --arg current_bot "$REVIEW_BOT_CURRENT" --arg prefix "$head_prefix" --arg since "$evidence_after" \
              '[.[] | select((.user.login == $bot or .user.login == $current_bot) and (.created_at // "") >= $since and ((.body // "") | contains("**Reviewed commit:** `" + $prefix)))] | length' \
              <<<"$issue_comments")"
            blocker_evidence="$(jq -r \
              --arg bot "$REVIEW_BOT" --arg current_bot "$REVIEW_BOT_CURRENT" --arg head "$head_sha" \
              '[.[] | select((.user.login == $bot or .user.login == $current_bot) and .commit_id == $head) | (.body // "") | select(test("(^|[^[:alnum:]])P(0|1)([^[:alnum:]]|$)|security[[:space:]]+(hold|blocker)|critical[[:space:]]+(blocker|security)"; "i"))] | length' \
              <<<"$reviews")"
            comment_blockers="$(jq -r \
              --arg bot "$REVIEW_BOT" --arg current_bot "$REVIEW_BOT_CURRENT" --argjson review_ids "$current_review_ids" \
              '[.[] | select(.user.login == $bot or .user.login == $current_bot) | select((.pull_request_review_id // null) as $review_id | ($review_ids | index($review_id)) != null) | (.body // "") | select(test("(^|[^[:alnum:]])P(0|1)([^[:alnum:]]|$)|security[[:space:]]+(hold|blocker)|critical[[:space:]]+(blocker|security)"; "i"))] | length' \
              <<<"$review_comments")"
            blocker_evidence=$((blocker_evidence + comment_blockers))
            issue_comment_blockers="$(jq -r \
              --arg bot "$REVIEW_BOT" --arg current_bot "$REVIEW_BOT_CURRENT" --arg prefix "$head_prefix" --arg since "$evidence_after" \
              '[.[] | select((.user.login == $bot or .user.login == $current_bot) and (.created_at // "") >= $since and ((.body // "") | contains("**Reviewed commit:** `" + $prefix))) | (.body // "") | select(test("(^|[^[:alnum:]])P(0|1)([^[:alnum:]]|$)|security[[:space:]]+(hold|blocker)|critical[[:space:]]+(blocker|security)"; "i"))] | length' \
              <<<"$issue_comments")"
            blocker_evidence=$((blocker_evidence + issue_comment_blockers))
            reaction_evidence="$(jq -r \
              --arg bot "$REVIEW_BOT" --arg current_bot "$REVIEW_BOT_CURRENT" --arg since "$evidence_after" \
              '[.[] | select((.user.login == $bot or .user.login == $current_bot) and .content == "+1" and (.created_at // "") >= $since)] | length' \
              <<<"$reactions")"

            if [[ "$blocker_evidence" -gt 0 ]]; then
              create_check completed failure "Independent agent review found a hard blocker" \
                "Exact head $head_sha has $blocker_evidence P0/P1/security blocker evidence from $REVIEW_BOT."
              echo "Independent agent review found $blocker_evidence P0/P1/security blocker(s) for exact head $head_sha." >&2
              exit 1
            fi

            if [[ "$review_evidence" -gt 0 || "$reviewed_issue_evidence" -gt 0 || "$reaction_evidence" -gt 0 ]]; then
              if [[ "$review_evidence" -gt 0 ]]; then
                evidence_note="COMMENTED review is accepted when no P0/P1/security blocker is present."
              elif [[ "$reviewed_issue_evidence" -gt 0 ]]; then
                evidence_note="The trusted reviewer recorded an exact-head Codex review comment after the event."
              else
                evidence_note="The reviewer recorded a fresh +1 reaction after the exact-head event."
              fi
              create_check completed success "Independent agent review verified" \
                "Exact head $head_sha was reviewed by $REVIEW_BOT. $evidence_note"
              echo "Independent agent review verified exact head $head_sha. $evidence_note"
              exit 0
            fi

            if [[ "$attempt" -lt 20 ]]; then
              sleep 15
            fi
          done

          # Missing optional review evidence is a normal quality observation,
          # not a merge gate.  Keep it visible as neutral so callers never
          # mistake the absence of a reviewer for a workflow failure.
          create_check completed neutral "Independent agent review unavailable" \
            "No exact-head review or fresh reviewer reaction from $REVIEW_BOT was observed for $head_sha."
          echo "Independent agent review unavailable for exact head $head_sha; advisory only."
          exit 0
