name: ops-suite

# Linux 可執行的 ops regression suite。GitHub PR 以 pr-gate 作為所有變更的穩定
# 入口；本 workflow 只在 ops／相關腳本變更時擴大執行完整分類的 Linux groups。
# 本地等價入口：./ops/test_ops.sh <group...>

on:
  workflow_call:
    inputs:
      # Routed by ops/ci_scope_router.sh (Issue #2641). Only an explicit
      # 'false' skips the macOS native ops job; push runs (no inputs) and any
      # unknown value keep it running.
      macos_ops:
        description: Whether the macOS native ops groups are in scope (true or false)
        required: false
        default: 'true'
        type: string
  push:
    branches: [main]
    paths:
      - 'ops/**'
      # Include repo-root scripts whose behavior is covered by the ops regression suite.
      - 'devops.sh'
      - 'start.sh'
      # These paths have no shared prefix, so keep them explicit and test the list.
      - 'backend/restart_kg.sh'
      - 'backend/view_logs.sh'
      # Backend ops CLI driven by ops tests (Issue #2326); mirror ops/ci_scope_router.sh.
      - 'backend/ops_cli.py'
      - 'backend/ops_edit.py'
      - 'backend/src/kg/ops_*'
      - 'backend/tests/ops_helpers.py'
      - 'lab/podcast/**'
      - 'scripts/ios_token_lint.sh'
      - '.claude/skills/app-debug/find-polluter.sh'
      - '.claude/skills/ios-simulator-verification/scripts/run_ui_evidence.sh'
      - '.claude/skills/ios-simulator-verification/scripts/test_run_ui_evidence.sh'
      - '.github/workflows/ops-suite.yml'
# 三個 job 都只 checkout（含 fetch-depth: 0）後跑本地 script；token 不進 step env，
# 不需要 contents 以外的 scope。
permissions:
  contents: read

jobs:
  discover:
    name: discover Linux ops groups
    runs-on: ubuntu-latest
    # 實測約 55 秒（checkout 全歷史 + 分類檢查）；5 分鐘留給 jq 缺席時的 apt 安裝。
    timeout-minutes: 5
    outputs:
      linux-groups: ${{ steps.groups.outputs.linux-groups }}
      shards: ${{ steps.groups.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify jq
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi
          jq --version
      - name: Assert every group is classified
        run: ./ops/tests/test_ops_ci_coverage.sh
      - name: Emit Linux group matrix input
        id: groups
        shell: bash
        run: |
          set -euo pipefail
          groups_json="$(./ops/tests/test_ops_ci_coverage.sh --print-linux-groups \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          shards_json="$(jq -c -n '[range(0; 8)]')"
          printf 'linux-groups=%s\n' "$groups_json" >> "$GITHUB_OUTPUT"
          printf 'shards=%s\n' "$shards_json" >> "$GITHUB_OUTPUT"
          printf 'Discovered Linux ops groups: %s\n' "$groups_json"
      - name: Verify platform exclusions
        run: ./ops/ci_expected_fail_exclusions.sh

  suite:
    name: Linux ops shard ${{ matrix.shard }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.discover.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # docs-lint verifies that every doc's verified_against commit is
          # reachable from HEAD, which needs real history in the object db.
          fetch-depth: 0
      - name: Install uv
        # setup-uv v10 的 enable-cache 預設是 "auto"，在 GitHub-hosted runner 上等於開啟，
        # 所以這裡不需要（也不該）顯式寫 enable-cache: true——那會讀起來像是這個 edit
        # 帶來了加速，實際上什麼都沒改變。
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Verify tools the shard needs
        # 明列，不靠 ubuntu-latest 碰巧預裝：runner image 的工具清單不是契約，而
        # `ubuntu-latest` 是會動的標籤。實測（runner 等價容器）少了它們的後果——
        # jq→ui-quality-plane/branch-audit、sqlite3→backup-verify、
        # python3→infra-health、ssh→證偽器自我檢驗。清單與
        # ops/tests/test_ops_ci_coverage.sh 開頭那段註解是同一份，改一邊要改兩邊。
        shell: bash
        run: |
          set -euo pipefail
          declare -A packages=(
            [rg]=ripgrep
            [jq]=jq
            [sqlite3]=sqlite3
            [python3]=python3
            [ssh]=openssh-client
            [zsh]=zsh
          )
          missing=()
          for command_name in "${!packages[@]}"; do
            command -v "$command_name" >/dev/null 2>&1 || missing+=("${packages[$command_name]}")
          done
          if (( ${#missing[@]} > 0 )); then
            ./ops/ci_apt_install.sh "${missing[@]}"
          fi
          for command_name in "${!packages[@]}"; do
            command -v "$command_name" >/dev/null 2>&1
          done
      - name: Run assigned Linux ops groups
        env:
          LINUX_GROUPS_JSON: ${{ needs.discover.outputs.linux-groups }}
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: '8'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t groups < <(jq -r '.[]' <<<"$LINUX_GROUPS_JSON")
          selected=()
          for i in "${!groups[@]}"; do
            if (( i % SHARD_COUNT == SHARD )); then
              selected+=("${groups[$i]}")
            fi
          done
          (( ${#selected[@]} > 0 )) || {
            echo "shard $SHARD received no Linux ops groups" >&2
            exit 1
          }
          printf 'shard=%s groups=%s\n' "$SHARD" "${selected[*]}"
          ./ops/test_ops.sh "${selected[@]}"

  macos-native-ops:
    name: macOS native ops groups
    # macos-26 runners are the scarce pool: run only when the change touches
    # what these groups exercise (ops/ci_scope_router.sh `macos_ops`).
    if: ${{ inputs.macos_ops != 'false' }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv
        # macos-26 映像清單有 jq/git/pipx，但沒有 uv 也沒有 ripgrep；ios-ops 的
        # test_ios_ops.sh 與 backend pytest 都經 `uv run`，缺了會在中段以 rc=127
        # 收尾（不是在入口就具名失敗）。與 Linux job 同一份 pin，不靠映像碰巧預裝。
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Verify tools the macOS groups need
        # 明列且 fail-fast：映像工具清單不是契約。ripgrep 刻意不在清單內——這三個
        # group 的碼已改用 grep，不得再依賴映像沒有的 rg。
        shell: bash
        run: |
          set -euo pipefail
          for command_name in jq uv plutil xcrun; do
            command -v "$command_name" >/dev/null 2>&1 || {
              echo "macOS native ops group needs '$command_name' on PATH" >&2
              exit 1
            }
          done
      - name: Run macOS native ops groups
        run: ./ops/test_ops.sh ios-sentry-wiring ios-ops lldb-forensics
