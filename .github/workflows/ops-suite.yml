name: ops-suite

# Linux 可執行的 ops regression suite。GitHub PR 以 pr-gate 作為所有變更的穩定
# 入口；本 workflow 只在 ops／相關腳本變更時擴大執行完整分類的 Linux groups。
# 本地等價入口：./ops/test_ops.sh <group...>
# scope=full（merge group、push）跑全部 Linux groups；scope=targeted（PR gate）只跑
# ops/ci_ops_suite_plan.py 依 diff 判定的 groups，無法判定即 fail safe 回 full（#3467）。

on:
  workflow_call:
    inputs:
      # Routed by ops/ci_scope_router.sh (Issue #2641). Only an explicit
      # 'false' skips the macOS native ops job; push runs (no inputs) and any
      # unknown value keep it running.
      macos_ops:
        description: Whether the macOS native ops groups are in scope (true or false)
        required: false
        default: 'true'
        type: string
      # full: every Linux group (merge group and push, which pass no scope).
      # targeted: only the groups the diff base..head selects (pr-gate, #3467).
      scope:
        description: full runs every Linux ops group; targeted runs the groups the base..head diff selects
        required: false
        default: 'full'
        type: string
      base:
        description: Exact base commit of the diff range (scope=targeted)
        required: false
        default: ''
        type: string
      head:
        description: Exact head commit of the diff range (scope=targeted)
        required: false
        default: ''
        type: string
    outputs:
      linux_group_count:
        description: Linux groups discovery selected; 0 means no shard ran by design
        value: ${{ jobs.discover.outputs.group-count }}
  push:
    branches: [main]
    paths:
      - 'ops/**'
      # Include repo-root scripts whose behavior is covered by the ops regression suite.
      - 'devops.sh'
      - 'start.sh'
      # These paths have no shared prefix, so keep them explicit and test the list.
      - 'backend/restart_kg.sh'
      - 'backend/view_logs.sh'
      # Backend ops CLI driven by ops tests (Issue #2326); mirror ops/ci_scope_router.sh.
      - 'backend/ops_cli.py'
      - 'backend/ops_edit.py'
      - 'backend/src/kg/ops_*'
      - 'backend/tests/ops_helpers.py'
      - 'lab/podcast/**'
      - 'scripts/ios_token_lint.sh'
      - '.claude/skills/app-debug/find-polluter.sh'
      - '.claude/skills/ios-simulator-verification/scripts/run_ui_evidence.sh'
      - '.claude/skills/ios-simulator-verification/scripts/test_run_ui_evidence.sh'
      - '.github/workflows/ops-suite.yml'
      # macOS-routed paths outside ops/** (ops/ci_scope_router.sh macos_ops=true); #3439.
      - 'docs/sop/ios.md'
      - 'ios/BooksAndVocab.xcodeproj/project.pbxproj'
      - 'ios/BooksAndVocab.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'
      - 'ios/BooksAndVocab/Services/AppCrashReporting.swift'
      - 'ios/BooksAndVocab/Services/SentryConfiguration.swift'
      - 'ios/BooksAndVocab/Services/SentryPrivacyPolicy.swift'
      - 'ios/BooksAndVocab/Services/SentryReporter.swift'
      - 'ios/BooksAndVocabUITests/*.swift'
      - 'ios/Info.plist'
# 三個 job 都只 checkout（含 fetch-depth: 0）後跑本地 script；token 不進 step env，
# 不需要 contents 以外的 scope（macos-native-ops 例外：job 層加 actions: read，
# 只供 ci_macos_queue_probe.sh 讀自己 run 的排隊時間，#2641）。
permissions:
  contents: read

jobs:
  discover:
    name: discover Linux ops groups
    runs-on: ubuntu-latest
    # 實測約 55 秒（checkout 全歷史 + 分類檢查）；5 分鐘留給 jq 缺席時的 apt 安裝。
    timeout-minutes: 5
    outputs:
      linux-groups: ${{ steps.groups.outputs.linux-groups }}
      shards: ${{ steps.groups.outputs.shards }}
      shard-count: ${{ steps.groups.outputs.shard-count }}
      group-count: ${{ steps.groups.outputs.group-count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify jq
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi
          jq --version
      - name: Install uv
        # ci_ops_suite_plan.py is a uv script (PEP 723); same pin as the shard job.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Assert every group is classified
        run: ./ops/tests/test_ops_ci_coverage.sh
      - name: Plan Linux ops groups
        # Full scope never reads the diff. Targeted scope fails safe to the full
        # plan on any unmapped path or mapping error, so this step only fails when
        # the classification itself cannot run.
        id: groups
        shell: bash
        env:
          SCOPE: ${{ inputs.scope || 'full' }}
          BASE_SHA: ${{ inputs.base }}
          HEAD_SHA: ${{ inputs.head }}
        run: |
          set -euo pipefail
          plan_json="$(uv run --no-project --python 3.13 ./ops/ci_ops_suite_plan.py \
            --scope "$SCOPE" --base "$BASE_SHA" --head "$HEAD_SHA")"
          printf 'linux-groups=%s\n' "$(jq -c '.groups' <<<"$plan_json")" >> "$GITHUB_OUTPUT"
          printf 'shards=%s\n' "$(jq -c '[range(0; .shard_count)]' <<<"$plan_json")" >> "$GITHUB_OUTPUT"
          printf 'shard-count=%s\n' "$(jq -r '.shard_count' <<<"$plan_json")" >> "$GITHUB_OUTPUT"
          printf 'group-count=%s\n' "$(jq -r '.group_count' <<<"$plan_json")" >> "$GITHUB_OUTPUT"
          printf 'Linux ops plan: %s\n' "$plan_json"
      - name: Verify platform exclusions
        run: ./ops/ci_expected_fail_exclusions.sh

  suite:
    name: Linux ops shard ${{ matrix.shard }}
    needs: discover
    # A targeted PR can select zero Linux groups (docs- or backend-only): the plan
    # then carries an empty shard list and this job is skipped by design.
    if: ${{ needs.discover.outputs.shards != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.discover.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # docs-lint verifies that every doc's verified_against commit is
          # reachable from HEAD, which needs real history in the object db.
          fetch-depth: 0
      - name: Install uv
        # setup-uv v10 的 enable-cache 預設是 "auto"，在 GitHub-hosted runner 上等於開啟，
        # 所以這裡不需要（也不該）顯式寫 enable-cache: true——那會讀起來像是這個 edit
        # 帶來了加速，實際上什麼都沒改變。
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Verify tools the shard needs
        # 明列，不靠 ubuntu-latest 碰巧預裝：runner image 的工具清單不是契約，而
        # `ubuntu-latest` 是會動的標籤。實測（runner 等價容器）少了它們的後果——
        # jq→ui-quality-plane/branch-audit、sqlite3→backup-verify、
        # python3→infra-health、ssh→證偽器自我檢驗。清單與
        # ops/tests/test_ops_ci_coverage.sh 開頭那段註解是同一份，改一邊要改兩邊。
        shell: bash
        run: |
          set -euo pipefail
          declare -A packages=(
            [rg]=ripgrep
            [jq]=jq
            [sqlite3]=sqlite3
            [python3]=python3
            [ssh]=openssh-client
            [zsh]=zsh
          )
          missing=()
          for command_name in "${!packages[@]}"; do
            command -v "$command_name" >/dev/null 2>&1 || missing+=("${packages[$command_name]}")
          done
          if (( ${#missing[@]} > 0 )); then
            ./ops/ci_apt_install.sh "${missing[@]}"
          fi
          for command_name in "${!packages[@]}"; do
            command -v "$command_name" >/dev/null 2>&1
          done
      - name: Run assigned Linux ops groups
        env:
          LINUX_GROUPS_JSON: ${{ needs.discover.outputs.linux-groups }}
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.discover.outputs.shard-count }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t groups < <(jq -r '.[]' <<<"$LINUX_GROUPS_JSON")
          selected=()
          for i in "${!groups[@]}"; do
            if (( i % SHARD_COUNT == SHARD )); then
              selected+=("${groups[$i]}")
            fi
          done
          (( ${#selected[@]} > 0 )) || {
            echo "shard $SHARD received no Linux ops groups" >&2
            exit 1
          }
          printf 'shard=%s groups=%s\n' "$SHARD" "${selected[*]}"
          ./ops/test_ops.sh "${selected[@]}"

  macos-native-ops:
    name: macOS native ops groups
    # macos-26 runners are the scarce pool: run only when the change touches
    # what these groups exercise (ops/ci_scope_router.sh `macos_ops`).
    if: ${{ inputs.macos_ops != 'false' }}
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Record macOS queue wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ops/ci_macos_queue_probe.sh
      - name: Install uv
        # macos-26 映像清單有 jq/git/pipx，但沒有 uv 也沒有 ripgrep；ios-ops 的
        # test_ios_ops.sh 與 backend pytest 都經 `uv run`，缺了會在中段以 rc=127
        # 收尾（不是在入口就具名失敗）。與 Linux job 同一份 pin，不靠映像碰巧預裝。
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Verify tools the macOS groups need
        # 明列且 fail-fast：映像工具清單不是契約。ripgrep 刻意不在清單內——這三個
        # group 的碼已改用 grep，不得再依賴映像沒有的 rg。
        shell: bash
        run: |
          set -euo pipefail
          for command_name in jq uv plutil xcrun; do
            command -v "$command_name" >/dev/null 2>&1 || {
              echo "macOS native ops group needs '$command_name' on PATH" >&2
              exit 1
            }
          done
      - name: Run macOS native ops groups
        run: ./ops/test_ops.sh ios-sentry-wiring ios-ops lldb-forensics
