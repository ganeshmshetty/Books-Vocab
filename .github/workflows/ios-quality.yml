name: ios-quality

# Real iOS validation belongs on a GitHub-hosted macOS/Xcode runner. This
# workflow is reusable from two callers: pr-gate, which compiles only
# (run_tests=false, so a PR is never tested twice), and merge-group-required,
# which runs the full suite once on the exact tree the merge queue lands
# (run_tests=true). Owner decision 2026-10-11. A daily run on main re-validates
# runner and Xcode drift; ops/main_watch.py opens a fix issue when it is red.

on:
  workflow_call:
    inputs:
      # Routed by ops/ci_scope_router.sh. Anything other than a validated
      # `targeted` request (including absent inputs on push/dispatch) runs the
      # full path; see the `plan` job.
      ios_mode:
        description: iOS confidence mode from the scope router (full or targeted)
        required: false
        default: full
        type: string
      ios_selectors:
        description: Space-separated Suite/Method selectors, only meaningful when ios_mode is targeted
        required: false
        default: ''
        type: string
      # Routed by ops/ci_scope_router.sh (Issue #2641). Only an explicit
      # 'false' drops the ui-smoke leg of the full path.
      ui_smoke:
        description: Whether the ui-smoke leg is in scope for the full path (true or false)
        required: false
        default: 'true'
        type: string
      # Only an explicit 'false' (pr-gate) drops every simulator test job, leaving
      # the compile check. Absent (schedule, dispatch) or 'true' runs the suite.
      run_tests:
        description: Whether the simulator test jobs run (true) or only the ios-build compile check (false)
        required: false
        default: 'true'
        type: string
    # Each job result, read from ios-verdict. A reusable-workflow caller reports
    # one aggregate result, so callers that must prove a specific job ran (the
    # PR confidence verdict) read these instead.
    outputs:
      build_result:
        description: Result of ios-build
        value: ${{ jobs.ios-verdict.outputs.build_result }}
      tests_result:
        description: Aggregate result of the ios-tests matrix
        value: ${{ jobs.ios-verdict.outputs.tests_result }}
      targeted_result:
        description: Result of the ios-targeted job
        value: ${{ jobs.ios-verdict.outputs.targeted_result }}
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub-hosted runner for a manual iOS CI benchmark
        required: false
        default: macos-26
        type: choice
        options:
          - macos-26
          - macos-26-intel
  # Daily full run on main (owner decision 2026-10-11) for runner and Xcode drift
  # and flakes. There is no push trigger: the merge queue already validated the
  # exact tree that main received.
  schedule:
    - cron: '17 19 * * *'

permissions:
  contents: read

# Only pull_request runs cancel a superseded run. Merge-queue runs (their own
# gh-readonly-queue ref), scheduled runs on main and manual runs must run to
# completion: a merge-queue entry is a gate and must not be cancelled, and with
# cancel-in-progress false GitHub keeps one running plus one pending run per group.
concurrency:
  group: ios-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IOS_SIMULATOR_NAME: iPhone 17 Pro Max

jobs:
  # Fail-closed mode resolution. Targeted needs a router-requested mode AND a
  # selector list that is strictly Suite/Method tokens on a single line; every
  # other value (missing, malformed, multi-line, empty) resolves to full.
  plan:
    name: ios-plan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      selectors: ${{ steps.plan.outputs.selectors }}
      scopes: ${{ steps.plan.outputs.scopes }}
    steps:
      - name: Resolve iOS confidence mode
        id: plan
        env:
          REQUESTED_MODE: ${{ inputs.ios_mode }}
          REQUESTED_SELECTORS: ${{ inputs.ios_selectors }}
          REQUESTED_UI_SMOKE: ${{ inputs.ui_smoke }}
        shell: bash
        run: |
          set -euo pipefail
          mode=full
          selectors=''
          if [[ "$REQUESTED_MODE" == 'targeted' && "$REQUESTED_SELECTORS" != *$'\n'* ]]; then
            read -r -a items <<<"$REQUESTED_SELECTORS"
            valid=0
            if ((${#items[@]} > 0)); then
              valid=1
              for item in "${items[@]}"; do
                [[ "$item" =~ ^[A-Za-z0-9_]+/[A-Za-z0-9_]+$ ]] || valid=0
              done
            fi
            if ((valid == 1)); then
              mode=targeted
              selectors="${items[*]}"
            fi
          fi
          # Full path test scopes: unit always; ui-smoke unless the router
          # explicitly reports ui_smoke=false (absent input => full set).
          scopes='["unit","ui-smoke"]'
          if [[ "$REQUESTED_UI_SMOKE" == 'false' ]]; then
            scopes='["unit"]'
          fi
          printf 'mode=%s\nselectors=%s\nscopes=%s\n' "$mode" "$selectors" "$scopes" >> "$GITHUB_OUTPUT"
          echo "ios confidence mode: $mode scopes: $scopes"

  ios-build:
    name: ios-build
    needs: [plan, ios-targeted]
    # The PR compile check (run_tests=false) is the only build here. With tests
    # on, ios-build-for-testing compiles the scheme once and the test legs run
    # from its products (#3331). UITests compiled only on the ui-smoke scope, so a
    # ui_smoke=false unit-only plan does not compile them. Skipping this job on
    # that path keeps one compile per merge-group entry (#3238). ios-verdict
    # checks that a skipped build is only reached on that path.
    if: ${{ always() && inputs.run_tests == 'false' }}
    # PRs use macos-26. A maintainer may manually benchmark the documented
    # Intel alternative before changing the default; the dispatch choice
    # admits only the two documented GitHub-hosted labels.
    runs-on: ${{ github.event.inputs.runner || 'macos-26' }}
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Record macOS queue wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ops/ci_macos_queue_probe.sh

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Select Xcode and verify simulator
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          selected=''
          for candidate in \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.4.1.app \
            /Applications/Xcode_26.4.app \
            /Applications/Xcode.app; do
            if [[ -d "$candidate" ]]; then
              selected="$candidate"
              break
            fi
          done
          [[ -n "$selected" ]] || { echo 'No supported Xcode installation found' >&2; exit 1; }
          sudo xcode-select --switch "$selected"
          printf 'DEVELOPER_DIR=%s/Contents/Developer\n' "$selected" >> "$GITHUB_ENV"
          xcodebuild -version
          printf 'cache_key=%s\n' "$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          xcrun simctl list runtimes
          xcrun simctl list devices available | grep -F "${IOS_SIMULATOR_NAME} (" >/dev/null

      - name: Restore SwiftPM source cache
        id: swiftpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kg-ios-swiftpm
          key: ios-swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.cache_key }}-${{ hashFiles('ios/BooksAndVocab.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Prepare SwiftPM cache root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kg-ios-swiftpm"
          printf 'KG_IOS_SWIFTPM_CACHE_DIR=%s/kg-ios-swiftpm\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Build app and test targets
        env:
          CI: '1'
          KG_IOS_BUILD_LOCK_TIMEOUT: '1800'
          KG_IOS_VERDICT_FILE: ${{ runner.temp }}/ios-build-verdict
        shell: bash
        run: |
          set -o pipefail
          ./ops/ios_ops.sh build \
            --destination "platform=iOS Simulator,name=${IOS_SIMULATOR_NAME}" \
            2>&1 | tee "$RUNNER_TEMP/ios-build.log"

      - name: Collect build evidence on failure
        if: ${{ always() }}
        env:
          VERDICT_JSON: ${{ runner.temp }}/ios-build-verdict.json
          ARTIFACT_DIR: ${{ runner.temp }}/ios-build-artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          if [[ -s "$VERDICT_JSON" ]]; then
            jq -r '.artifacts | [.log, .xcresult] | .[] | select(type == "string" and length > 0)' "$VERDICT_JSON" \
              | while IFS= read -r source; do
                  [[ -e "$source" ]] || continue
                  cp -R "$source" "$ARTIFACT_DIR/$(basename "$source")"
                done
          fi

      - name: Upload build evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-build.log
            ${{ runner.temp }}/ios-build-verdict*
            ${{ runner.temp }}/ios-build-artifacts/**
          if-no-files-found: warn
          retention-days: 7

  # Build once, test from the products (#3331). With tests on, this job compiles
  # the scheme a single time with build-for-testing and uploads only what
  # test-without-building reads: the .xctestrun and Build/Products. ios-tests and
  # ios-targeted download that archive and never compile, so a merge-group entry
  # pays for one compile instead of one per test leg. The scheme is the union
  # (BooksAndVocab: unit and UI test targets) whenever a UI leg or a targeted run
  # reads it; a unit-only plan compiles BooksAndVocabUnitTests alone.
  ios-build-for-testing:
    name: ios-build-for-testing
    needs: plan
    if: ${{ always() && inputs.run_tests != 'false' }}
    runs-on: ${{ github.event.inputs.runner || 'macos-26' }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Record macOS queue wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ops/ci_macos_queue_probe.sh

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Select Xcode and verify simulator
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          selected=''
          for candidate in \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.4.1.app \
            /Applications/Xcode_26.4.app \
            /Applications/Xcode.app; do
            if [[ -d "$candidate" ]]; then
              selected="$candidate"
              break
            fi
          done
          [[ -n "$selected" ]] || { echo 'No supported Xcode installation found' >&2; exit 1; }
          sudo xcode-select --switch "$selected"
          printf 'DEVELOPER_DIR=%s/Contents/Developer\n' "$selected" >> "$GITHUB_ENV"
          xcodebuild -version
          printf 'cache_key=%s\n' "$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          xcrun simctl list runtimes
          xcrun simctl list devices available | grep -F "${IOS_SIMULATOR_NAME} (" >/dev/null

      - name: Restore SwiftPM source cache
        id: swiftpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kg-ios-swiftpm
          key: ios-swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.cache_key }}-${{ hashFiles('ios/BooksAndVocab.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Prepare SwiftPM cache root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kg-ios-swiftpm"
          printf 'KG_IOS_SWIFTPM_CACHE_DIR=%s/kg-ios-swiftpm\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Select build scope
        id: scope
        env:
          PLAN_MODE: ${{ needs.plan.outputs.mode }}
          PLAN_SCOPES: ${{ needs.plan.outputs.scopes }}
        shell: bash
        run: |
          set -euo pipefail
          scheme_flag='--unit'
          if [[ "$PLAN_MODE" == 'targeted' || "$PLAN_SCOPES" == *'"ui-smoke"'* ]]; then
            scheme_flag='--all-targets'
          fi
          printf 'scheme_flag=%s\n' "$scheme_flag" >> "$GITHUB_OUTPUT"
          echo "build-for-testing scope: $scheme_flag"

      - name: Build test products once
        env:
          CI: '1'
          KG_IOS_BUILD_LOCK_TIMEOUT: '1800'
          SCHEME_FLAG: ${{ steps.scope.outputs.scheme_flag }}
        shell: bash
        run: |
          set -euo pipefail
          # --prepare-cache is the build-for-testing writer. Its JSON payload on
          # stdout names the products; xcodebuild's own log stays in the payload.
          ./ops/ios_ops.sh test --prepare-cache "$SCHEME_FLAG" --coverage \
            --destination "platform=iOS Simulator,name=${IOS_SIMULATOR_NAME}" --json \
            >"$RUNNER_TEMP/ios-build-for-testing.json"
          jq -e '(.status == "prepared" or .status == "hit") and .cache.productsReady == true' \
            "$RUNNER_TEMP/ios-build-for-testing.json" >/dev/null
          derived_root="$(jq -r '.cache.derivedDataRoot' "$RUNNER_TEMP/ios-build-for-testing.json")"
          [[ -d "$derived_root/Build/Products" ]] || { echo '::error::build-for-testing left no Build/Products' >&2; exit 1; }
          tar -cf "$RUNNER_TEMP/ios-test-products.tar" -C "$derived_root" Build/Products

      - name: Collect build evidence on failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/ios-build-for-testing-artifacts"
          mkdir -p "$artifact_dir"
          if [[ -s "$RUNNER_TEMP/ios-build-for-testing.json" ]]; then
            jq -r '.artifacts | [.buildLog, .resultBundle] | .[] | select(type == "string" and length > 0)' "$RUNNER_TEMP/ios-build-for-testing.json" \
              | while IFS= read -r source; do
                  [[ -e "$source" ]] || continue
                  cp -R "$source" "$artifact_dir/$(basename "$source")"
                done
          fi

      - name: Upload build evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-build-for-testing-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-build-for-testing.json
            ${{ runner.temp }}/ios-build-for-testing-artifacts/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test products
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-products-${{ github.run_id }}
          path: ${{ runner.temp }}/ios-test-products.tar
          if-no-files-found: error
          retention-days: 1
          # Run-scoped name (no run_attempt) so "Re-run failed jobs" finds these products;
          # overwrite replaces them when a full re-run builds again (#3591).
          overwrite: true

  ios-tests:
    name: ios-tests (${{ matrix.scope }})
    needs: [plan, ios-targeted, ios-build-for-testing]
    if: ${{ always() && inputs.run_tests != 'false' && (needs.plan.outputs.mode != 'targeted' || needs.ios-targeted.outputs.fallback_full == 'true') }}
    runs-on: ${{ github.event.inputs.runner || 'macos-26' }}
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJSON(needs.plan.outputs.scopes) }}

    steps:
      - name: Require build-once test products
        env:
          BUILD_FOR_TESTING_RESULT: ${{ needs.ios-build-for-testing.result }}
        shell: bash
        run: |
          set -euo pipefail
          # Fail closed (#3331): a test leg never compiles. A failed, cancelled or
          # skipped build leaves no products, so this leg fails here and ios-verdict
          # reads the red leg.
          if [[ "$BUILD_FOR_TESTING_RESULT" != 'success' ]]; then
            echo "::error::ios-build-for-testing is $BUILD_FOR_TESTING_RESULT; no prebuilt test products to run" >&2
            exit 1
          fi

      # Bounded and retried once (#3591): a hung or failed download is cut at 3
      # minutes instead of holding the leg to the 25-minute job timeout. The retry
      # runs only when this attempt did not succeed; if it fails too, the unpack step
      # below does not run and the leg fails red (no silent rebuild).
      - name: Download build-once test products
        id: download-test-products
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ios-test-products-${{ github.run_id }}
          path: ${{ runner.temp }}/ios-test-products

      - name: Retry download build-once test products
        if: ${{ steps.download-test-products.outcome != 'success' }}
        timeout-minutes: 3
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ios-test-products-${{ github.run_id }}
          path: ${{ runner.temp }}/ios-test-products

      - name: Unpack build-once test products
        shell: bash
        run: |
          set -euo pipefail
          products_root="$RUNNER_TEMP/ios-test-products"
          tar -xf "$products_root/ios-test-products.tar" -C "$products_root"
          rm -f "$products_root/ios-test-products.tar"
          found=()
          while IFS= read -r candidate; do
            found+=("$candidate")
          done < <(find "$products_root/Build/Products" -maxdepth 1 -type f -name '*.xctestrun' | sort)
          if [[ "${#found[@]}" -ne 1 ]]; then
            echo "::error::expected exactly one .xctestrun in the test products, found ${#found[@]}" >&2
            exit 1
          fi
          printf 'IOS_XCTESTRUN=%s\n' "${found[0]}" >> "$GITHUB_ENV"
          echo "prebuilt xctestrun: ${found[0]}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Record macOS queue wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ops/ci_macos_queue_probe.sh

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Select Xcode and verify simulator
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          selected=''
          for candidate in \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.4.1.app \
            /Applications/Xcode_26.4.app \
            /Applications/Xcode.app; do
            if [[ -d "$candidate" ]]; then
              selected="$candidate"
              break
            fi
          done
          [[ -n "$selected" ]] || { echo 'No supported Xcode installation found' >&2; exit 1; }
          sudo xcode-select --switch "$selected"
          printf 'DEVELOPER_DIR=%s/Contents/Developer\n' "$selected" >> "$GITHUB_ENV"
          xcodebuild -version
          printf 'cache_key=%s\n' "$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          xcrun simctl list runtimes
          xcrun simctl list devices available | grep -F "${IOS_SIMULATOR_NAME} (" >/dev/null

      - name: Restore SwiftPM source cache
        id: swiftpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kg-ios-swiftpm
          key: ios-swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.cache_key }}-${{ hashFiles('ios/BooksAndVocab.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Prepare SwiftPM cache root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kg-ios-swiftpm"
          printf 'KG_IOS_SWIFTPM_CACHE_DIR=%s/kg-ios-swiftpm\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Ensure simulator and export UDID
        shell: bash
        run: |
          set -euo pipefail
          simulator_json="$(./ops/ios_ops.sh simulator ensure-booted \
            --device "$IOS_SIMULATOR_NAME" --json)"
          simulator_udid="$(jq -er '.device.udid // empty' <<<"$simulator_json")"
          printf 'IOS_SIMULATOR_UDID=%s\n' "$simulator_udid" >> "$GITHUB_ENV"
          printf 'Using simulator UDID: %s\n' "$simulator_udid"

      - name: Validate UI World
        if: ${{ matrix.scope == 'ui-smoke' }}
        run: uv run --no-project --python 3.13 python ops/ui_world_manifest.py validate ops/fixtures/ui_worlds/marketing_demo.json

      - name: Run iOS unit tests or UI smoke tests
        env:
          CI: '1'
          KG_IOS_BUILD_LOCK_TIMEOUT: '1800'
          # Liveness is owned by the job timeout and XCTest's bounded
          # per-test allowance. A raw log-silence cutoff is invalid here:
          # hosted xcodebuild can be silent during a healthy test session.
          KG_IOS_TEST_MAX_EXECUTION_TIME_ALLOWANCE: '420'
          KG_IOS_VERDICT_FILE: ${{ runner.temp }}/ios-${{ matrix.scope }}-verdict
        shell: bash
        run: |
          set -o pipefail
          if [[ "${{ matrix.scope }}" == 'unit' ]]; then
            ./ops/ios_ops.sh test \
              --unit \
              --device "$IOS_SIMULATOR_UDID" \
              --coverage \
              --json \
              --xctestrun "$IOS_XCTESTRUN" \
              2>&1 | tee "$RUNNER_TEMP/ios-unit.log"
          else
            ./ops/ios_ops.sh test \
              --ui \
              --dataset marketing_demo \
              --device "$IOS_SIMULATOR_UDID" \
              --json \
              --xctestrun "$IOS_XCTESTRUN" \
              BooksAndVocabUITests/testLaunchShowsAllTabs \
              FixtureDatasetUITests/testBookshelfRendersDatasetOverriddenTitle \
              2>&1 | tee "$RUNNER_TEMP/ios-ui-smoke.log"
          fi

      # Only the scheduled run on main writes this cache: PRs restore caches from
      # main, and merge-queue refs are not visible to PRs. A Package.resolved change
      # is therefore seeded by the next daily run, not by the merge that changed it.
      # Written by the unit leg only: the compile happens once in
      # ios-build-for-testing, which does not write, and the leg resolves the same
      # packages into the cache root below so the save never stores an empty tree.
      - name: Resolve SwiftPM packages for the cache save
        if: ${{ !cancelled() && matrix.scope == 'unit' && github.event_name == 'schedule' && github.ref == 'refs/heads/main' && steps.swiftpm-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          source ops/lib/ios_swiftpm_cache.sh
          kg_ios_swiftpm_configure "$PWD"
          xcodebuild -resolvePackageDependencies \
            -project ios/BooksAndVocab.xcodeproj \
            -scheme BooksAndVocabUnitTests \
            ${KG_IOS_SWIFTPM_XCODEBUILD_ARGS[@]+"${KG_IOS_SWIFTPM_XCODEBUILD_ARGS[@]}"}

      - name: Save SwiftPM source cache from trusted main
        if: ${{ !cancelled() && matrix.scope == 'unit' && github.event_name == 'schedule' && github.ref == 'refs/heads/main' && steps.swiftpm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kg-ios-swiftpm
          key: ${{ steps.swiftpm-cache.outputs.cache-primary-key }}

      - name: Collect test evidence on failure
        if: ${{ always() }}
        env:
          VERDICT_JSON: ${{ runner.temp }}/ios-${{ matrix.scope }}-verdict.json
          ARTIFACT_DIR: ${{ runner.temp }}/ios-${{ matrix.scope }}-artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          if [[ -s "$VERDICT_JSON" ]]; then
            jq -r '.artifacts | [.log, .xcresult] | .[] | select(type == "string" and length > 0)' "$VERDICT_JSON" \
              | while IFS= read -r source; do
                  [[ -e "$source" ]] || continue
                  cp -R "$source" "$ARTIFACT_DIR/$(basename "$source")"
                done
          fi

      - name: Upload test evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-${{ matrix.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-${{ matrix.scope }}.log
            ${{ runner.temp }}/ios-${{ matrix.scope }}-verdict*
            ${{ runner.temp }}/ios-${{ matrix.scope }}-artifacts/**
          if-no-files-found: warn
          retention-days: 7

  # Single-UITests-file confidence: run exactly the router-discovered selectors,
  # no video/visual capture. A zero-test or count-mismatched result is never
  # reported as success; it hands the PR to the full path above instead.
  ios-targeted:
    name: ios-targeted
    needs: [plan, ios-build-for-testing]
    if: ${{ needs.plan.outputs.mode == 'targeted' && inputs.run_tests != 'false' }}
    runs-on: ${{ github.event.inputs.runner || 'macos-26' }}
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      fallback_full: ${{ steps.verdict.outputs.fallback_full }}
    steps:
      - name: Require build-once test products
        env:
          BUILD_FOR_TESTING_RESULT: ${{ needs.ios-build-for-testing.result }}
        shell: bash
        run: |
          set -euo pipefail
          # Fail closed (#3331): a targeted run never compiles. needs gates this job,
          # so a failed, cancelled or skipped build skips the whole job and this step
          # never runs; ios-verdict then reads the skipped targeted result. This check
          # only holds if the build result is ever not success while the job runs.
          if [[ "$BUILD_FOR_TESTING_RESULT" != 'success' ]]; then
            echo "::error::ios-build-for-testing is $BUILD_FOR_TESTING_RESULT; no prebuilt test products to run" >&2
            exit 1
          fi

      # Bounded and retried once (#3591): a hung or failed download is cut at 3
      # minutes instead of holding the leg to the 25-minute job timeout. The retry
      # runs only when this attempt did not succeed; if it fails too, the unpack step
      # below does not run and the leg fails red (no silent rebuild).
      - name: Download build-once test products
        id: download-test-products
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ios-test-products-${{ github.run_id }}
          path: ${{ runner.temp }}/ios-test-products

      - name: Retry download build-once test products
        if: ${{ steps.download-test-products.outcome != 'success' }}
        timeout-minutes: 3
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ios-test-products-${{ github.run_id }}
          path: ${{ runner.temp }}/ios-test-products

      - name: Unpack build-once test products
        shell: bash
        run: |
          set -euo pipefail
          products_root="$RUNNER_TEMP/ios-test-products"
          tar -xf "$products_root/ios-test-products.tar" -C "$products_root"
          rm -f "$products_root/ios-test-products.tar"
          found=()
          while IFS= read -r candidate; do
            found+=("$candidate")
          done < <(find "$products_root/Build/Products" -maxdepth 1 -type f -name '*.xctestrun' | sort)
          if [[ "${#found[@]}" -ne 1 ]]; then
            echo "::error::expected exactly one .xctestrun in the test products, found ${#found[@]}" >&2
            exit 1
          fi
          printf 'IOS_XCTESTRUN=%s\n' "${found[0]}" >> "$GITHUB_ENV"
          echo "prebuilt xctestrun: ${found[0]}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Record macOS queue wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ops/ci_macos_queue_probe.sh

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Select Xcode and verify simulator
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          selected=''
          for candidate in \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.4.1.app \
            /Applications/Xcode_26.4.app \
            /Applications/Xcode.app; do
            if [[ -d "$candidate" ]]; then
              selected="$candidate"
              break
            fi
          done
          [[ -n "$selected" ]] || { echo 'No supported Xcode installation found' >&2; exit 1; }
          sudo xcode-select --switch "$selected"
          printf 'DEVELOPER_DIR=%s/Contents/Developer\n' "$selected" >> "$GITHUB_ENV"
          xcodebuild -version
          printf 'cache_key=%s\n' "$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          xcrun simctl list runtimes
          xcrun simctl list devices available | grep -F "${IOS_SIMULATOR_NAME} (" >/dev/null

      - name: Restore SwiftPM source cache
        id: swiftpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kg-ios-swiftpm
          key: ios-swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.cache_key }}-${{ hashFiles('ios/BooksAndVocab.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Prepare SwiftPM cache root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kg-ios-swiftpm"
          printf 'KG_IOS_SWIFTPM_CACHE_DIR=%s/kg-ios-swiftpm\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Ensure simulator and export UDID
        shell: bash
        run: |
          set -euo pipefail
          simulator_json="$(./ops/ios_ops.sh simulator ensure-booted \
            --device "$IOS_SIMULATOR_NAME" --json)"
          simulator_udid="$(jq -er '.device.udid // empty' <<<"$simulator_json")"
          printf 'IOS_SIMULATOR_UDID=%s\n' "$simulator_udid" >> "$GITHUB_ENV"
          printf 'Using simulator UDID: %s\n' "$simulator_udid"

      - name: Validate UI World
        run: uv run --no-project --python 3.13 python ops/ui_world_manifest.py validate ops/fixtures/ui_worlds/marketing_demo.json

      - name: Run targeted UI selectors
        id: run
        # The verdict step below owns pass/fail/fallback; a red run here must
        # not hide a zero-executed result behind an early job failure.
        continue-on-error: true
        env:
          CI: '1'
          KG_IOS_BUILD_LOCK_TIMEOUT: '1800'
          KG_IOS_TEST_MAX_EXECUTION_TIME_ALLOWANCE: '420'
          KG_IOS_VISUAL_CAPTURE: '0'
          KG_IOS_VERDICT_FILE: ${{ runner.temp }}/ios-targeted-verdict
          IOS_TARGETED_SELECTORS: ${{ needs.plan.outputs.selectors }}
        shell: bash
        run: |
          set -o pipefail
          read -r -a selectors <<<"$IOS_TARGETED_SELECTORS"
          ((${#selectors[@]} > 0)) || { echo 'no targeted selectors' >&2; exit 1; }
          ./ops/ios_ops.sh test \
            --ui \
            --dataset marketing_demo \
            --device "$IOS_SIMULATOR_UDID" \
            --json \
            --xctestrun "$IOS_XCTESTRUN" \
            "${selectors[@]}" \
            2>&1 | tee "$RUNNER_TEMP/ios-targeted.log"

      - name: Verify executed count or fall back to full
        id: verdict
        if: ${{ always() }}
        env:
          RUN_OUTCOME: ${{ steps.run.outcome }}
          VERDICT_JSON: ${{ runner.temp }}/ios-targeted-verdict.json
          IOS_TARGETED_SELECTORS: ${{ needs.plan.outputs.selectors }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a selectors <<<"$IOS_TARGETED_SELECTORS"
          expected="${#selectors[@]}"
          reason=''
          executed=''
          if [[ -s "$VERDICT_JSON" ]]; then
            reason="$(jq -r '.reason // empty' "$VERDICT_JSON")"
            executed="$(jq -r '.executed // empty' "$VERDICT_JSON")"
          fi
          if [[ "$RUN_OUTCOME" == 'success' && "$executed" =~ ^[0-9]+$ ]] && ((executed == expected)); then
            echo "targeted run executed $executed/$expected selectors"
            exit 0
          fi
          # Success without the expected count, or the harness's own zero-test
          # guard, means the targeted evidence is not trustworthy: run full.
          if [[ "$RUN_OUTCOME" == 'success' || "$reason" == 'false-green-0-executed' ]]; then
            echo "::warning::targeted run is not trustworthy (outcome=$RUN_OUTCOME executed='${executed}' expected=$expected reason='${reason}'); falling back to the full iOS path"
            printf 'fallback_full=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "targeted run failed (outcome=$RUN_OUTCOME reason='${reason}')" >&2
          exit 1

      - name: Collect test evidence on failure
        if: ${{ always() }}
        env:
          VERDICT_JSON: ${{ runner.temp }}/ios-targeted-verdict.json
          ARTIFACT_DIR: ${{ runner.temp }}/ios-targeted-artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          if [[ -s "$VERDICT_JSON" ]]; then
            jq -r '.artifacts | [.log, .xcresult] | .[] | select(type == "string" and length > 0)' "$VERDICT_JSON" \
              | while IFS= read -r source; do
                  [[ -e "$source" ]] || continue
                  cp -R "$source" "$ARTIFACT_DIR/$(basename "$source")"
                done
          fi

      - name: Upload test evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-targeted-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-targeted.log
            ${{ runner.temp }}/ios-targeted-verdict*
            ${{ runner.temp }}/ios-targeted-artifacts/**
          if-no-files-found: warn
          retention-days: 7

  # Republishes each iOS job result as a job output, which workflow_call exposes
  # as build_result, tests_result and targeted_result. The confidence verdict and
  # the merge gate read those values, because one aggregate caller result cannot
  # prove that the compile check ran.
  ios-verdict:
    name: ios-verdict
    needs: [plan, ios-build, ios-tests, ios-targeted]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      build_result: ${{ steps.verdict.outputs.build_result }}
      tests_result: ${{ steps.verdict.outputs.tests_result }}
      targeted_result: ${{ steps.verdict.outputs.targeted_result }}
    steps:
      - name: Record each iOS job result
        id: verdict
        env:
          BUILD_RESULT: ${{ needs.ios-build.result }}
          TESTS_RESULT: ${{ needs.ios-tests.result }}
          TARGETED_RESULT: ${{ needs.ios-targeted.result }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'build_result=%s\ntests_result=%s\ntargeted_result=%s\n' \
            "$BUILD_RESULT" "$TESTS_RESULT" "$TARGETED_RESULT" >> "$GITHUB_OUTPUT"
          printf 'ios-build=%s ios-tests=%s ios-targeted=%s\n' \
            "$BUILD_RESULT" "$TESTS_RESULT" "$TARGETED_RESULT"

      # Fail closed: every result must match the path the gates selected. A
      # skipped build is correct only with tests on (ios-build-for-testing compiles
      # the scheme there); a failed or unexpectedly skipped test path fails the
      # workflow. ios-build-for-testing reaches this verdict through the test legs:
      # a red or skipped build leaves ios-tests and ios-targeted without products,
      # so their guard step fails them and the required result turns red.
      - name: Enforce the expected iOS job outcomes
        env:
          RUN_TESTS: ${{ inputs.run_tests }}
          PLAN_MODE: ${{ needs.plan.outputs.mode }}
          FALLBACK_FULL: ${{ needs.ios-targeted.outputs.fallback_full }}
          BUILD_RESULT: ${{ needs.ios-build.result }}
          TESTS_RESULT: ${{ needs.ios-tests.result }}
          TARGETED_RESULT: ${{ needs.ios-targeted.result }}
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$*" >&2; exit 1; }
          if [[ "$RUN_TESTS" == 'false' ]]; then
            [[ "$BUILD_RESULT" == success ]] || fail "PR compile check: ios-build is $BUILD_RESULT"
            [[ "$TESTS_RESULT" == skipped && "$TARGETED_RESULT" == skipped ]] \
              || fail "PR compile check ran tests (ios-tests=$TESTS_RESULT ios-targeted=$TARGETED_RESULT)"
            exit 0
          fi
          [[ "$BUILD_RESULT" == skipped ]] || fail "ios-build ran with tests on (result $BUILD_RESULT)"
          # A failed or skipped plan leaves mode empty, which is the full path.
          if [[ "$PLAN_MODE" != 'targeted' || "$FALLBACK_FULL" == 'true' ]]; then
            [[ "$TESTS_RESULT" == success ]] || fail "full iOS tests result is $TESTS_RESULT"
            exit 0
          fi
          [[ "$TARGETED_RESULT" == success && "$TESTS_RESULT" == skipped ]] \
            || fail "accepted targeted run needs ios-targeted success and full tests skipped (targeted=$TARGETED_RESULT ios-tests=$TESTS_RESULT)"
