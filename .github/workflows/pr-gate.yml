name: pr-gate

# This is the only pull_request entrypoint. The component workflows run in
# parallel, but branch protection observes only `required`: a short PR gate.
# Merge queue groups use the separate merge-group-required workflow so queue
# admission never waits for the full confidence fan-out below.
on:
  pull_request:
    # `ready_for_review` changes metadata only. The latest opened/synchronize
    # run already validates the same head; rerunning would cancel or duplicate
    # its full-confidence fan-out without producing new code evidence.
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact pull request number
        required: true
        type: string
      base_sha:
        description: Exact pull request base SHA
        required: true
        type: string
      head_sha:
        description: Exact pull request head SHA
        required: true
        type: string

permissions:
  contents: read

env:
  BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.pull_request.head.sha }}

concurrency:
  group: pr-gate-${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repo-gate:
    name: repo-gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Reject manual dispatch ref drift
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_SHA" != "$HEAD_SHA" ]]; then
            echo "manual dispatch ref drift: event SHA $EVENT_SHA does not match requested HEAD_SHA $HEAD_SHA" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_SHA }}

      - name: Verify exact head checkout
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$HEAD_SHA" ]]; then
            echo "checkout drift: expected $HEAD_SHA, got $actual_sha" >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # BASE_SHA is the base branch tip when the run started, not the PR's fork
      # point. Diffing it against HEAD would also contain the reverse of every
      # main commit merged after the fork, so only the merge base describes
      # this PR's own changes.
      - name: Check repository diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA"

      - name: Check changed Python formatting
        shell: bash
        run: |
          set -euo pipefail
          for sha_name in BASE_SHA HEAD_SHA; do
            sha="${!sha_name}"
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "$sha_name is not an exact 40-character commit SHA: $sha" >&2
              exit 1
            fi
            resolved_sha="$(git rev-parse --verify "$sha^{commit}")"
            if [[ "$resolved_sha" != "$sha" ]]; then
              echo "$sha_name does not resolve exactly: expected $sha, got $resolved_sha" >&2
              exit 1
            fi
          done
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$HEAD_SHA" ]]; then
            echo "format checkout drift: expected $HEAD_SHA, got $actual_sha" >&2
            exit 1
          fi
          if ! diff_base_sha="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"; then
            echo "cannot determine a common ancestor for BASE_SHA and HEAD_SHA" >&2
            exit 1
          fi
          changed_python=()
          while IFS= read -r path; do
            [[ -n "$path" ]] && changed_python+=("$path")
          done < <(git diff --name-only --diff-filter=d "$diff_base_sha" "$HEAD_SHA" -- '*.py')
          if ((${#changed_python[@]} == 0)); then
            echo "no changed Python files; format check skipped"
            exit 0
          fi
          uv run --no-project --python 3.13 --with 'ruff==0.16.3' ruff format --check "${changed_python[@]}"

      - name: Check ops test coverage classification
        run: ./ops/tests/test_ops_ci_coverage.sh

      - name: Run repository gate
        run: ./ops/test_ops.sh docs-lint worktree context-routing github-workflows delivery-control

  changed-paths:
    name: classify confidence scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      ops: ${{ steps.plan.outputs.ops }}
      ios: ${{ steps.plan.outputs.ios }}
      ios_mode: ${{ steps.plan.outputs.ios_mode }}
      ios_selectors: ${{ steps.plan.outputs.ios_selectors }}
      macos_ops: ${{ steps.plan.outputs.macos_ops }}
      ui_smoke: ${{ steps.plan.outputs.ui_smoke }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_SHA }}

      - name: Verify exact head checkout
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$HEAD_SHA" ]]; then
            echo "checkout drift: expected $HEAD_SHA, got $actual_sha" >&2
            exit 1
          fi

      - name: Classify non-blocking confidence scope
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          ./ops/ci_scope_router.sh --base "$BASE_SHA" --head "$HEAD_SHA" --format github-output >> "$GITHUB_OUTPUT"

  backend-quality:
    name: backend-quality
    needs: changed-paths
    if: ${{ needs.changed-paths.outputs.backend == 'true' }}
    uses: ./.github/workflows/backend-quality.yml

  llm-eval:
    name: llm-eval
    uses: ./.github/workflows/llm-eval.yml

  design-system:
    name: design-system
    uses: ./.github/workflows/design-system.yml

  ui-quality-gate:
    name: ui-quality-gate
    uses: ./.github/workflows/ui-quality-gate.yml

  ops-suite:
    name: ops-suite
    needs: changed-paths
    if: ${{ needs.changed-paths.outputs.ops == 'true' }}
    uses: ./.github/workflows/ops-suite.yml
    with:
      macos_ops: ${{ needs.changed-paths.outputs.macos_ops }}

  ios-quality:
    name: ios-quality
    needs: changed-paths
    if: ${{ needs.changed-paths.outputs.ios == 'true' }}
    uses: ./.github/workflows/ios-quality.yml
    # Empty/unknown values are resolved to the full path by ios-quality's plan job.
    with:
      ios_mode: ${{ needs.changed-paths.outputs.ios_mode }}
      ios_selectors: ${{ needs.changed-paths.outputs.ios_selectors }}
      ui_smoke: ${{ needs.changed-paths.outputs.ui_smoke }}

  required:
    name: required
    if: ${{ always() }}
    needs: [repo-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Assert the short merge gate passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          if jq -e 'to_entries | any(.value.result != "success")' <<<"$NEEDS_JSON" >/dev/null; then
            echo 'one or more required gates failed' >&2
            exit 1
          fi

  confidence:
    name: confidence
    if: ${{ always() }}
    needs: [changed-paths, repo-gate, backend-quality, llm-eval, design-system, ui-quality-gate, ops-suite, ios-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_SHA }}

      - name: Verify exact head checkout
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$HEAD_SHA" ]]; then
            echo "checkout drift: expected $HEAD_SHA, got $actual_sha" >&2
            exit 1
          fi

      - name: Report the complete validation fan-out
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          PLAN_JSON: >-
            {"backend":"${{ needs.changed-paths.outputs.backend }}","ops":"${{ needs.changed-paths.outputs.ops }}","ios":"${{ needs.changed-paths.outputs.ios }}"}
        run: |
          set -euo pipefail
          ./ops/ci_confidence_verdict.sh --plan "$PLAN_JSON" --needs "$NEEDS_JSON"
