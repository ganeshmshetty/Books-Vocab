<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
canvas { display: block; touch-action: none; background: transparent; transition: opacity 0.2s ease-out; }
</style>
</head>
<body>
<canvas id="g"></canvas>
<script src="d3.v7.min.js"></script>
<script>
// ── Global state ─────────────────────────────────────────────────────────────
let sim, nodes = [], links = [], forces = {};
let transform = d3.zoomIdentity;
let hoveredId = null, selectedId = null;
let isThumbnail = false;
let TIER_COLORS = { dark: {}, light: {} };
let EDGE_COLORS = {};
let adjCache = new Map();
let currentMode = 'dark';
// The holder creates this WKWebView before SwiftUI applies its final frame.
// Start degenerate so the first real layout pass always initializes the canvas.
let W = 0, H = 0;
let backgroundColor = 'transparent';
let labelColor = '#FFFFFF';
let labelShadowColor = 'rgba(0,0,0,0.9)';
let qt = null;
let _frameCount = 0, _lastFpsTime = performance.now();
let _drawScheduled = false;
let _lastHoveredId = null, _lastSelectedId = null;
const _rgbaCache = new Map();

const canvas = document.getElementById('g');
const ctx = canvas.getContext('2d');

// ── Glow texture cache ───────────────────────────────────────────────────────
const glowCache = new Map();

function getGlowTexture(color, radius) {
    const rBucket = Math.max(2, Math.round(radius / 2) * 2);
    const key = color + '_' + rBucket;
    let tex = glowCache.get(key);
    const size = Math.ceil(rBucket * 2.2 * 2);
    if (tex) return { tex, size };

    const off = document.createElement('canvas');
    off.width = size; off.height = size;
    const oc = off.getContext('2d');
    const cx = size / 2, cy = size / 2;
    const inner = rBucket * 0.4, outer = rBucket * 2.2;
    const grad = oc.createRadialGradient(cx, cy, inner, cx, cy, outer);
    grad.addColorStop(0, color + '30');
    grad.addColorStop(1, color + '00');
    oc.fillStyle = grad;
    oc.beginPath();
    oc.arc(cx, cy, outer, 0, 2 * Math.PI);
    oc.fill();

    glowCache.set(key, off);
    return { tex: off, size };
}

// ── Bridge to Swift ───────────────────────────────────────────────────────────
function postBridge(obj) {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.graphBridge) {
        window.webkit.messageHandlers.graphBridge.postMessage(obj);
    }
}

// ── Retina canvas + viewport reconciliation ──────────────────────────────────
function reconcileGraphViewport(nextWidth = window.innerWidth, nextHeight = window.innerHeight) {
    const width = Number.isFinite(Number(nextWidth)) ? Math.max(0, Number(nextWidth)) : 0;
    const height = Number.isFinite(Number(nextHeight)) ? Math.max(0, Number(nextHeight)) : 0;
    // WKWebView can emit duplicate resize/layout notifications when a tab is
    // reattached. Do not clear the backing store for an unchanged real size.
    if (width === W && height === H && W > 0 && H > 0) return false;

    const oldW = W, oldH = H;
    W = width;
    H = height;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Preserve the settled layout when the card grows or shrinks. Translating
    // on every actual size change is important: the first non-zero viewport is
    // often provisional, not just the zero-sized load pass.
    const dx = (W - oldW) / 2;
    const dy = (H - oldH) / 2;
    if (dx !== 0 || dy !== 0) {
        nodes.forEach(node => { node.x += dx; node.y += dy; });
    }

    if (!sim) return true;

    const cx = W / 2, cy = H / 2;
    sim.force('center', d3.forceCenter(cx, cy));
    const fx = sim.force('x'); if (fx) fx.x(cx);
    const fy = sim.force('y'); if (fy) fy.y(cy);
    const wasDegenerate = oldW < 10 || oldH < 10;
    sim.alpha(wasDegenerate ? 0.8 : 0.1).restart();
    scheduleDraw();
    return true;
}
window.reconcileGraphViewport = reconcileGraphViewport;
function resize() { return reconcileGraphViewport(window.innerWidth, window.innerHeight); }
window.addEventListener('resize', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();

// ── Node helpers ──────────────────────────────────────────────────────────────
function nodeRadius(d) {
    const base = forces.baseNodeRadius || 4;
    if (d.degree > 5) return base * 2.2;
    if (d.degree > 2) return base * 1.5;
    return base;
}

function nodeColor(d) {
    if (d.color) return d.color;
    const palette = TIER_COLORS[currentMode] || {};
    return palette[d.tier] || '#888888';
}

function baseOpacityForNode(d) {
    if (d.ratio == null) return 0.4;
    if (d.ratio >= 1.0) return 1.0;
    return 0.25 + d.ratio * 0.55;
}

function opacityForNode(id) {
    if (!hoveredId && !selectedId) return 1.0;
    const focusId = selectedId || hoveredId;
    if (id === focusId) return 1.0;
    if (adjCache.get(focusId)?.has(id)) return 0.8;
    return 0.15;
}

function opacityForEdge(sid, tid) {
    if (isThumbnail) return 0.08;
    if (!selectedId) return 0.25;
    if (sid === selectedId || tid === selectedId) return 0.7;
    return 0.05;
}

// ── Draw scheduling (rAF coalescing) ─────────────────────────────────────────
function scheduleDraw() {
    if (_drawScheduled) return;
    _drawScheduled = true;
    requestAnimationFrame(() => { _drawScheduled = false; draw(); });
}

// ── Draw ──────────────────────────────────────────────────────────────────────
function draw() {
    // FPS debug counter (enable via: window.debugFPS = true)
    if (window.debugFPS) {
        _frameCount++;
        const now = performance.now();
        if (now - _lastFpsTime >= 1000) {
            console.log('[graph-perf] ' + _frameCount + ' fps');
            _frameCount = 0;
            _lastFpsTime = now;
        }
    }

    // Thumbnail: check convergence for fade-in
    if (isThumbnail) {
        if (canvas.style.opacity === '0') {
            if (sim && sim.alpha() < 0.15) {
                canvas.style.opacity = '1';
                postBridge({ type: 'painted' });
            } else {
                return; // Skip drawing while hidden — no one can see it
            }
        }
        drawThumbnail();
        return;
    }

    drawFull();
}

// ── Thumbnail fast path (no glow, no labels, no batching overhead) ───────────
function drawThumbnail() {
    ctx.clearRect(0, 0, W, H);

    ctx.save();
    ctx.translate(transform.x, transform.y);
    ctx.scale(transform.k, transform.k);

    // Edges — single pass, uniform opacity 0.08
    const screenLineWidth = (forces.linkThickness || 1.0) / transform.k;
    ctx.globalAlpha = 0.08;
    ctx.lineWidth = screenLineWidth;
    ctx.strokeStyle = '#888888';
    ctx.beginPath();
    for (const l of links) {
        const s = l.source, t = l.target;
        if (!s || !t || s.x == null || t.x == null) continue;
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(t.x, t.y);
    }
    ctx.stroke();

    // Nodes — batched by color, uniform baseOpacity
    const nodeGroups = new Map();
    for (const d of nodes) {
        const r = nodeRadius(d);
        const color = nodeColor(d);
        const opacity = baseOpacityForNode(d);
        const key = color + '_' + opacity.toFixed(2);
        if (!nodeGroups.has(key)) nodeGroups.set(key, { color, opacity, arcs: [] });
        nodeGroups.get(key).arcs.push(d.x, d.y, r);
    }
    for (const [, g] of nodeGroups) {
        ctx.fillStyle = g.color;
        ctx.globalAlpha = g.opacity;
        ctx.beginPath();
        const arcs = g.arcs;
        for (let i = 0; i < arcs.length; i += 3) {
            ctx.moveTo(arcs[i] + arcs[i + 2], arcs[i + 1]);
            ctx.arc(arcs[i], arcs[i + 1], arcs[i + 2], 0, 2 * Math.PI);
        }
        ctx.fill();
    }

    ctx.restore();
}

// ── Full interactive draw ────────────────────────────────────────────────────
function drawFull() {
    ctx.clearRect(0, 0, W, H);
    if (backgroundColor !== 'transparent') {
        ctx.fillStyle = backgroundColor;
        ctx.fillRect(0, 0, W, H);
    }

    ctx.save();
    ctx.translate(transform.x, transform.y);
    ctx.scale(transform.k, transform.k);

    // Draw edges (batched by color + opacity to reduce state switches)
    const screenLineWidth = (forces.linkThickness || 1.0) / transform.k;
    const edgeGroups = new Map();
    for (const l of links) {
        const s = l.source, t = l.target;
        if (!s || !t || s.x == null || t.x == null) continue;
        const sid = typeof s === 'object' ? s.id : s;
        const tid = typeof t === 'object' ? t.id : t;
        const alpha = opacityForEdge(sid, tid);
        const color = EDGE_COLORS[l.kind] || '#888888';
        const key = color + '_' + alpha.toFixed(2);
        if (!edgeGroups.has(key)) edgeGroups.set(key, { color, alpha, segs: [] });
        edgeGroups.get(key).segs.push(s.x, s.y, t.x, t.y);
    }
    for (const [, g] of edgeGroups) {
        ctx.beginPath();
        const segs = g.segs;
        for (let i = 0; i < segs.length; i += 4) {
            ctx.moveTo(segs[i], segs[i + 1]);
            ctx.lineTo(segs[i + 2], segs[i + 3]);
        }
        ctx.strokeStyle = g.color;
        ctx.globalAlpha = g.alpha;
        ctx.lineWidth = screenLineWidth;
        ctx.stroke();
    }

    // Draw nodes — two passes: glow textures first, then fills batched by style
    // Pass 1: glow halos
    for (const d of nodes) {
        const interactOpacity = opacityForNode(d.id);
        if (interactOpacity < 0.1) continue;
        const r = nodeRadius(d);
        const color = nodeColor(d);
        const opacity = interactOpacity * baseOpacityForNode(d);
        const { tex, size } = getGlowTexture(color, r);
        ctx.globalAlpha = opacity;
        ctx.drawImage(tex, d.x - size / 2, d.y - size / 2, size, size);
    }

    // Pass 2: node fills batched by color + opacity
    const nodeGroups = new Map();
    for (const d of nodes) {
        const interactOpacity = opacityForNode(d.id);
        if (interactOpacity < 0.1) continue;
        const r = nodeRadius(d);
        const color = nodeColor(d);
        const opacity = interactOpacity * baseOpacityForNode(d);
        const key = color + '_' + opacity.toFixed(2);
        if (!nodeGroups.has(key)) nodeGroups.set(key, { color, opacity, arcs: [] });
        nodeGroups.get(key).arcs.push(d.x, d.y, r);
    }
    for (const [, g] of nodeGroups) {
        ctx.fillStyle = g.color;
        ctx.globalAlpha = g.opacity;
        ctx.beginPath();
        const arcs = g.arcs;
        for (let i = 0; i < arcs.length; i += 3) {
            ctx.moveTo(arcs[i] + arcs[i + 2], arcs[i + 1]);
            ctx.arc(arcs[i], arcs[i + 1], arcs[i + 2], 0, 2 * Math.PI);
        }
        ctx.fill();
    }

    // Draw labels (batched by font size, double-pass fillText)
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const baseMul = currentMode === 'dark' ? 0.90 : 0.82;

    // Batch: small labels (8px) then large labels (10px)
    for (let pass = 0; pass < 2; pass++) {
        const fontSize = pass === 0 ? 8 : 10;
        const degreeTest = pass === 0 ? (deg) => deg <= 3 : (deg) => deg > 3;
        ctx.font = `${fontSize}px -apple-system, sans-serif`;

        for (const d of nodes) {
            if (!degreeTest(d.degree)) continue;
            const opacity = opacityForNode(d.id);
            if (opacity < 0.2) continue;
            const r = nodeRadius(d);

            // Shadow pass
            ctx.fillStyle = labelShadowColor;
            ctx.globalAlpha = 0.6 * opacity;
            const label = d.badge ? `${d.badge} ${d.word}` : d.word;
            ctx.fillText(label, d.x + 1, d.y + r + 4);

            // Main pass (cached rgba)
            const labelAlpha = baseMul * opacity;
            const cacheKey = labelColor + '_' + labelAlpha.toFixed(3);
            let rgba = _rgbaCache.get(cacheKey);
            if (!rgba) { rgba = hexToRGBA(labelColor, labelAlpha); _rgbaCache.set(cacheKey, rgba); }
            ctx.fillStyle = rgba;
            ctx.globalAlpha = 1;
            ctx.fillText(label, d.x, d.y + r + 3);
        }
    }

    ctx.restore();
}

// ── Build adjacency cache ──────────────────────────────────────────────────────
function buildAdjCache() {
    adjCache.clear();
    nodes.forEach(n => adjCache.set(n.id, new Set()));
    links.forEach(l => {
        const sid = typeof l.source === 'object' ? l.source.id : l.source;
        const tid = typeof l.target === 'object' ? l.target.id : l.target;
        adjCache.get(sid)?.add(tid);
        adjCache.get(tid)?.add(sid);
    });
}

// ── findNode (quadtree O(log N)) ─────────────────────────────────────────────
function findNode(x, y) {
    if (!qt) return null;
    const sx = (x - transform.x) / transform.k;
    const sy = (y - transform.y) / transform.k;
    const maxR = (forces.baseNodeRadius || 4) * 2.2 + 4;
    const found = qt.find(sx, sy, maxR);
    if (!found) return null;
    if (Math.hypot(found.x - sx, found.y - sy) < nodeRadius(found) + 4) return found;
    return null;
}

function hexToRGBA(hex, alpha) {
    const normalized = hex.replace('#', '');
    const safe = normalized.length === 6 ? normalized : '888888';
    const r = parseInt(safe.slice(0, 2), 16);
    const g = parseInt(safe.slice(2, 4), 16);
    const b = parseInt(safe.slice(4, 6), 16);
    return `rgba(${r},${g},${b},${alpha})`;
}

// ── Interactions (bound once by initGraph, skipped in thumbnail) ─────────────
let interactionsBound = false;

function bindInteractions() {
    if (interactionsBound || isThumbnail) return;
    interactionsBound = true;

    const zoom = d3.zoom()
        .scaleExtent([0.1, 8])
        .on('zoom', e => { transform = e.transform; scheduleDraw(); });
    d3.select(canvas).call(zoom);

    const drag = d3.drag()
        .subject(function(event) {
            return findNode(event.x, event.y) || null;
        })
        .on('start', function(event) {
            if (!event.subject) return;
            const d = event.subject;
            d.fx = d.x; d.fy = d.y;
            if (sim) sim.alphaTarget(0.3).restart();
        })
        .on('drag', function(event) {
            if (!event.subject) return;
            const d = event.subject;
            d.fx = (event.x - transform.x) / transform.k;
            d.fy = (event.y - transform.y) / transform.k;
        })
        .on('end', function(event) {
            if (!event.subject) return;
            const d = event.subject;
            d.fx = null; d.fy = null;
            if (sim) sim.alphaTarget(0);
        });
    d3.select(canvas).call(drag);

    canvas.addEventListener('click', function(e) {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const node = findNode(x, y);
        if (node) {
            // Always notify native: the detail may have been dismissed while
            // selectedId stayed set, so a toggle-off here would swallow the tap.
            selectedId = node.id;
            postBridge({ type: 'nodeClick', nodeId: node.id });
        } else {
            selectedId = null;
        }
        scheduleDraw();
    });

    canvas.addEventListener('pointermove', function(e) {
        if (e.buttons !== 0) return;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const node = findNode(x, y);
        const newId = node ? node.id : null;
        if (newId !== hoveredId) {
            hoveredId = newId;
            scheduleDraw();
        }
    });

    canvas.addEventListener('pointerleave', function() {
        if (hoveredId !== null) { hoveredId = null; scheduleDraw(); }
    });
}

// ── initGraph ─────────────────────────────────────────────────────────────────
window.initGraph = function(jsonStr) {
    const data = JSON.parse(jsonStr);
    glowCache.clear();
    _rgbaCache.clear();
    forces = data.forces || {};
    isThumbnail = !!data.thumbnail;

    // Hide canvas during thumbnail simulation convergence
    if (isThumbnail) {
        canvas.style.opacity = '0';
    }

    // Cache tier colors
    const colors = data.theme?.colors || {};
    TIER_COLORS = { dark: {}, light: {} };
    for (const [tier, pair] of Object.entries(colors)) {
        TIER_COLORS.dark[tier]  = pair.dark  || '#888888';
        TIER_COLORS.light[tier] = pair.light || '#888888';
    }

    // Apply theme
    currentMode = data.theme?.mode || 'dark';
    backgroundColor = data.theme?.background || 'transparent';
    labelColor = data.theme?.label || (currentMode === 'dark' ? '#FFFFFF' : '#000000');
    labelShadowColor = hexToRGBA(
        data.theme?.labelShadow || (currentMode === 'dark' ? '#000000' : '#FFFFFF'),
        currentMode === 'dark' ? 0.86 : 0.90
    );
    Object.assign(EDGE_COLORS, data.theme?.edges || {});

    // Preserve existing positions
    const posMap = new Map();
    nodes.forEach(n => posMap.set(n.id, { x: n.x, y: n.y, vx: n.vx, vy: n.vy }));

    nodes = (data.nodes || []).map(n => {
        const old = posMap.get(n.id);
        const spawnR = isThumbnail ? 30 : 80;
        const spawnMin = isThumbnail ? 10 : 20;
        const radius = Math.random() * spawnR + spawnMin;
        const angle  = Math.random() * 2 * Math.PI;
        return Object.assign(n, {
            x:  old ? old.x  : Math.cos(angle) * radius + W / 2,
            y:  old ? old.y  : Math.sin(angle) * radius + H / 2,
            vx: old ? old.vx : 0,
            vy: old ? old.vy : 0
        });
    });

    links = (data.links || []).map(l => ({ ...l }));

    // Kill old sim
    if (sim) sim.stop();

    buildAdjCache();

    const cx = W / 2, cy = H / 2;
    const gravity = forces.centerStrength ?? 0.05;

    sim = d3.forceSimulation(nodes)
        .force('charge',  d3.forceManyBody().strength(-(forces.repel ?? 80)))
        .force('link',    d3.forceLink(links).id(d => d.id)
                            .distance(forces.linkDistance || 50)
                            .strength(forces.linkStrength != null ? forces.linkStrength : undefined))
        .force('center',  d3.forceCenter(cx, cy))
        .force('x',       d3.forceX(cx).strength(gravity))
        .force('y',       d3.forceY(cy).strength(gravity))
        .force('collide', d3.forceCollide().radius(d => nodeRadius(d) + 2))
        .on('tick', () => {
            if (!isThumbnail) qt = d3.quadtree(nodes, d => d.x, d => d.y);
            draw();
        });

    if (isThumbnail) {
        sim.alphaDecay(0.08).alphaMin(0.05).velocityDecay(0.6);
        sim.force('collide', null);
    }

    draw();
    bindInteractions();
};

// ── updateForces ──────────────────────────────────────────────────────────────
window.updateForces = function(arg) {
    forces = typeof arg === 'string' ? JSON.parse(arg) : arg;
    if (!sim) return;
    const gravity2 = forces.centerStrength ?? 0.05;
    sim.force('charge',  d3.forceManyBody().strength(-(forces.repel ?? 80)));
    sim.force('link',    d3.forceLink(links).id(d => d.id)
                           .distance(forces.linkDistance || 50)
                           .strength(forces.linkStrength != null ? forces.linkStrength : undefined));
    sim.force('x',       d3.forceX(W / 2).strength(gravity2));
    sim.force('y',       d3.forceY(H / 2).strength(gravity2));
    sim.force('collide', d3.forceCollide().radius(d => nodeRadius(d) + 2));
    sim.alpha(0.3).restart();
};

// ── updateTheme ───────────────────────────────────────────────────────────────
window.updateTheme = function(mode) {
    glowCache.clear();
    _rgbaCache.clear();
    currentMode = mode;
    draw();
};

// ── reheat ────────────────────────────────────────────────────────────────────
window.reheat = function() {
    if (sim) sim.alpha(0.3).restart();
};

// ── Ready ─────────────────────────────────────────────────────────────────────
// Defer 'ready' until the viewport has real dimensions. WKWebView loads this
// HTML while its frame is still .zero (holder is created before SwiftUI layout
// applies a frame), so DOMContentLoaded fires with innerWidth/Height === 0.
// Posting ready then would let initGraph run on a 0×0 canvas, spawn nodes at
// (0,0), and converge invisibly — the source of the blank-thumbnail bug.
let readyPosted = false;
function postReadyWhenSized() {
    if (readyPosted) return;
    if (window.innerWidth > 0 && window.innerHeight > 0) {
        readyPosted = true;
        // Ensure resize() reflects the now-real viewport before initGraph runs.
        resize();
        postBridge({ type: 'ready' });
        return true;
    }
    return false;
}

function startReadyWatch() {
    if (postReadyWhenSized()) return;
    // rAF fallback — also covers environments where ResizeObserver doesn't
    // fire for the html element (defensive; ResizeObserver should suffice).
    function tick() {
        if (postReadyWhenSized()) return;
        requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
}

// Keep observing after ready. The SwiftUI holder can receive a provisional
// non-zero frame first and its final card frame later.
function startViewportWatch() {
    if (typeof ResizeObserver === 'undefined') return;
    const ro = new ResizeObserver(() => {
        resize();
        postReadyWhenSized();
    });
    ro.observe(document.documentElement);
}

if (document.readyState === 'complete' || document.readyState === 'interactive') {
    startViewportWatch();
    startReadyWatch();
} else {
    document.addEventListener('DOMContentLoaded', () => {
        startViewportWatch();
        startReadyWatch();
    });
}
</script>
</body>
</html>
